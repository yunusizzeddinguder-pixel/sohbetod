            authDomain: "sohbet-1e450.firebaseapp.com",

<script type="module">
    // Firebase SDK Modülleri
    import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, getDocs, updateDoc, collection, onSnapshot, query, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Global Proje Kimlikleri (İletişim Yapısına Uygun)
    let app = null;
    let auth = null;
    let db = null;
    const appId = window.__app_id || 'sohbetod-premium-system';
    const provider = new GoogleAuthProvider();

    function parseFirebaseConfig() {
        const raw = window.__firebase_config || window.SOHBETOD_DEFAULT_FIREBASE_CONFIG;
        if (!raw) return null;
        try {
            return typeof raw === 'string' ? JSON.parse(raw) : raw;
        } catch (e) {
            console.error('Firebase config parse hatası:', e);
            return window.SOHBETOD_DEFAULT_FIREBASE_CONFIG || null;
        }
    }

    function initFirebase() {
        if (app && auth && db) return true;
        const firebaseConfig = parseFirebaseConfig();
        if (!firebaseConfig || !firebaseConfig.apiKey) return false;
        try {
            app = getApps().length ? getApp() : initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            setPersistence(auth, browserLocalPersistence).catch(() => {});
            try {
                localStorage.setItem('sohbetod_firebase_config', JSON.stringify(firebaseConfig));
            } catch (e) {}
            return true;
        } catch (e) {
            console.error('Firebase başlatma hatası:', e);
            return false;
        }
    }

    const REACTIONS = ['👍','❤️','😂','😮','😢','🙏'];

    // Durum Değişkenleri
    let myUid = null;
    let myProfile = { name: '', photoURL: '', about: '', aboutPublic: false, isGuest: false };
    
    let currentChatType = null; // 'room' | 'dm'
    let currentRoomId = null;
    let currentDmUid = null;
    let currentChatId = null;

    let currentRoomInfo = null;
    let currentRoomMembers = {};
    let currentRoomAdmins = {};

    let messagesCache = {};
    let replyContext = null;

    // Aktif Dinleyici Tanımları
    let activeChatUnsub = null;
    let activeRoomMembersUnsub = null;
    let typingUnsub = null;
    let presenceInterval = null;
    let lobbyRoomUnsub = null;
    let lobbyDmUnsub = null;
    let dmPresenceUnsub = null;
    let pendingDeepLinkRoom = null;
    let lastMessageCount = 0;

    // Ses Kaydı Değişkenleri
    let mediaRecorder = null, mediaStream = null, audioChunks = [];
    let recordTimerInterval = null, recordSeconds = 0, recordedBlobForSend = null, recordedBlobURL = null;

    // Sekme Aktiflik Kontrolleri
    let isTabActive = true;
    window.onfocus = () => { isTabActive = true; updateOnlineStatus(true); };
    window.onblur = () => { isTabActive = false; };
    window.addEventListener('beforeunload', () => { updateOnlineStatus(false); });

    // --- Firestore Yardımcıları ---
    const usersCol = () => collection(db, 'artifacts', appId, 'public', 'data', 'users');
    const roomsCol = () => collection(db, 'artifacts', appId, 'public', 'data', 'rooms');
    const dmsCol = () => collection(db, 'artifacts', appId, 'public', 'data', 'dms');
    const userRef = (uid) => doc(db, 'artifacts', appId, 'public', 'data', 'users', uid);
    const roomRef = (roomId) => doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
    const msgCol = (chatId) => collection(db, 'artifacts', appId, 'public', 'data', 'messages_' + chatId);
    const msgRef = (chatId, msgId) => doc(db, 'artifacts', appId, 'public', 'data', 'messages_' + chatId, msgId);
    const typingRef = (chatId) => doc(db, 'artifacts', appId, 'public', 'data', 'typing', chatId);

    function ensureFirebase() {
        if (db && auth) return true;
        if (initFirebase()) return true;
        toast('Bağlantı kurulamadı. Sayfayı yenileyin veya internet bağlantınızı kontrol edin.', 'error');
        return false;
    }

    function slugifyRoomId(name) {
        return name.toLocaleLowerCase('tr-TR').replace(/\s+/g, '-').replace(/[^a-z0-9\-çğıöşü]/g, '');
    }

    async function hashPassword(text) {
        const data = new TextEncoder().encode(text);
        const hash = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function copyToClipboard(text) {
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                return true;
            }
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            ta.remove();
            return ok;
        } catch (e) {
            return false;
        }
    }

    function isNearBottom(el, threshold = 120) {
        return el.scrollHeight - el.scrollTop - el.clientHeight < threshold;
    }

    function handleDeepLinkRoom() {
        const params = new URLSearchParams(window.location.search);
        const roomParam = params.get('room');
        if (!roomParam || !myUid) return;
        pendingDeepLinkRoom = roomParam;
        const cleanUrl = window.location.pathname + window.location.hash;
        window.history.replaceState({}, '', cleanUrl);
        enterRoomById(pendingDeepLinkRoom);
        pendingDeepLinkRoom = null;
    }

    // --- HTML Güvenli Çeviri ---
    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function jsStr(str) {
        return String(str ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    // --- SVG Dinamik Avatar Oluşturma ---
    function defaultAvatar(name) {
        const safe = (name || '?').trim();
        const letter = safe.charAt(0).toUpperCase() || '?';
        const colors = ['#2563EB', '#FF7A59', '#10B981', '#EF4444', '#06B6D4', '#8B5CF6'];
        let hash = 0;
        for (let i = 0; i < safe.length; i++) hash = (hash * 31 + safe.charCodeAt(i)) % 997;
        const color = colors[Math.abs(hash) % colors.length];
        const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><rect width='80' height='80' rx='40' fill='${color}'/><text x='50%' y='57%' font-size='34' fill='white' text-anchor='middle' font-family='Outfit,sans-serif'>${letter}</text></svg>`;
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    // --- Şık Bildirim Modülü (Toast) ---
    function toast(msg, type = 'info') {
        const root = document.getElementById('modal-root');
        const color = type === 'error' ? 'bg-red-600 text-white shadow-red-500/20' : 'bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-950';
        const t = document.createElement('div');
        t.className = `fixed bottom-24 left-1/2 -translate-x-1/2 ${color} px-5 py-3 rounded-full text-xs font-semibold z-[4000] shadow-2xl transition-all duration-300 opacity-0 translate-y-4`;
        t.textContent = msg;
        root.appendChild(t);
        requestAnimationFrame(() => {
            t.classList.remove('opacity-0', 'translate-y-4');
            t.classList.add('opacity-100', 'translate-y-0');
        });
        setTimeout(() => {
            t.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => t.remove(), 300);
        }, 2200);
    }

    // --- Görsel Sıkıştırma (Base64) ---
    function resizeImageFile(file, maxDim = 800, quality = 0.75) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
                        else { width = Math.round(width * maxDim / height); height = maxDim; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    window.addEventListener('load', async () => {
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        if (!initFirebase()) {
            toast('Firebase başlatılamadı. İnternet bağlantınızı veya proje ayarlarını kontrol edin.', 'error');
            bindGlobalHandlers();
            bindStaticButtons();
            showLobbyLoggedOut();
            return;
        }
        
        bindGlobalHandlers();
        bindStaticButtons();
        await initAuth();
        
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                showLobbyLoggedOut();
                return;
            }
            
            // Eğer misafir veya özel oturum önbellekte varsa
            const savedSession = localStorage.getItem('guest_session');
            if (savedSession) {
                const creds = JSON.parse(savedSession);
                myUid = creds.uid;
                loadUserProfile(myUid);
                return;
            }

            // Google kullanıcısı ise
            if (user && !user.isAnonymous) {
                myUid = user.uid;
                const userDocRef = userRef(myUid);
                const userSnap = await getDoc(userDocRef);
                if (userSnap.exists()) {
                    myProfile = userSnap.data();
                } else {
                    myProfile = { name: user.displayName || 'Kullanıcı', photoURL: user.photoURL || '', email: user.email || '', about: 'Sohbetod Premium üyesi.', aboutPublic: true, isGuest: false };
                    await setDoc(userDocRef, myProfile);
                }
                if (user.email && myProfile.email !== user.email) {
                    myProfile.email = user.email;
                    await setDoc(userDocRef, { email: user.email }, { merge: true });
                }
                showLobbyLoggedIn();
                loadLobby();
                startPresence();
                requestNotifPermission();
                handleDeepLinkRoom();
                return;
            }

            showLobbyLoggedOut();
        });
    });

    async function submitGuestLogin() {
        if (!ensureFirebase()) return;
        const username = document.getElementById('guest-username').value.trim();
        const password = document.getElementById('guest-password').value.trim();

        if (!username || password.length < 6) {
            toast('Kullanıcı adı ve en az 6 karakterlik şifre gereklidir.', 'error');
            return;
        }

        const cleanUsername = username.replace(/[^a-zA-Z0-9_ğüşöçİĞÜŞÖÇ]/g, '');
        if (!cleanUsername) {
            toast('Kullanıcı adı geçersiz karakterler içeriyor.', 'error');
            return;
        }

        // Firebase kurallarına uygun yolda kayıt denetimi
        const credsRef = doc(db, 'artifacts', appId, 'public', 'data', 'guest_credentials', cleanUsername);
        
        try {
            const credsSnap = await getDoc(credsRef);
            if (!credsSnap.exists()) {
                // Yeni Kayıt Oluşturma
                const customUid = 'guest_' + cleanUsername + '_' + Math.random().toString(36).substr(2, 9);
                const passwordHash = await hashPassword(password + ':' + cleanUsername);
                await setDoc(credsRef, { passwordHash, uid: customUid });
                
                myProfile = { name: cleanUsername, photoURL: '', email: '', about: 'Sohbetod Premium üyesi.', aboutPublic: true, isGuest: true };
                await setDoc(userRef(customUid), myProfile);
                
                myUid = customUid;
                localStorage.setItem('guest_session', JSON.stringify({ username: cleanUsername, uid: customUid }));
                wrongAttempts = 0;
                closeSheet();
                showLobbyLoggedIn();
                loadLobby();
                startPresence();
                requestNotifPermission();
                toast('Kayıt başarıyla tamamlandı!');
            } else {
                // Giriş Denetleme
                const data = credsSnap.data();
                const passwordHash = await hashPassword(password + ':' + cleanUsername);
                const storedHash = data.passwordHash || (data.password ? await hashPassword(data.password + ':' + cleanUsername) : '');
                if (storedHash === passwordHash || data.password === password) {
                    if (!data.passwordHash && data.password === password) {
                        await setDoc(credsRef, { passwordHash, password: null }, { merge: true });
                    }
                    myUid = data.uid;
                    localStorage.setItem('guest_session', JSON.stringify({ username: cleanUsername, uid: data.uid }));
                    wrongAttempts = 0;
                    closeSheet();
                    await loadUserProfile(myUid);
                    toast('Başarıyla giriş yapıldı!');
                } else {
                    wrongAttempts++;
                    if (wrongAttempts >= 3) {
                        toast('3 kez yanlış şifre girdiniz! Ana sayfaya dönülüyor.', 'error');
                        wrongAttempts = 0;
                        closeSheet();
                        showLobbyLoggedOut();
                    } else {
                        toast(`Hatalı şifre! (Kalan hak: ${3 - wrongAttempts})`, 'error');
                    }
                }
            }
        } catch (e) {
            toast('Bağlantı veya yetkilendirme hatası oluştu.', 'error');
            console.error(e);
        }
    }

        const name = document.getElementById('new-room-name').value.trim();
        const desc = document.getElementById('new-room-desc').value.trim();
        const pass = document.getElementById('new-room-pass').value.trim();

        if (!name || !pass) {
            toast('Oda adı ve şifre zorunludur.', 'error');
            return;
        }

        const roomId = slugifyRoomId(name);
        if (!roomId) {
            toast('Geçersiz oda adı.', 'error');
            return;
        }

        const roomDocRef = roomRef(roomId);
        try {
            const snap = await getDoc(roomDocRef);
            if (snap.exists()) {
                toast('Bu oda adı zaten mevcut.', 'error');
                return;
            }

            const roomData = {
                id: roomId,
                name: name,
                description: desc,
                password: pass,
                founder: myUid,
                createdAt: Date.now(),
                members: { [myUid]: true },
                admins: { [myUid]: true }
            };

            await setDoc(roomDocRef, roomData);
            closeSheet();
            enterRoomById(roomId);

    async function submitJoinRoom() {
        const nameRaw = document.getElementById('join-room-name').value.trim();
        const pass = document.getElementById('join-room-pass').value.trim();

        if (!nameRaw || !pass) {
            toast('Lütfen tüm alanları doldurun.', 'error');
            return;
        }

        const roomId = slugifyRoomId(nameRaw);
        if (!roomId) {
            toast('Geçersiz oda adı.', 'error');
            return;
        }
        const roomDocRef = roomRef(roomId);
        
        try {
            const snap = await getDoc(roomDocRef);
            if (!snap.exists()) {
                toast('Oda bulunamadı.', 'error');
                return;
            }

            const room = snap.data();
            if (room.password !== pass) {
                toast('Hatalı şifre!', 'error');
                return;
            }

            const updates = { [`members.${myUid}`]: true };
            await updateDoc(roomDocRef, updates);
            closeSheet();
            enterRoomById(roomId);
            toast('Odaya katıldınız!');
        } catch (e) {
            toast('Katılım sırasında hata oluştu.', 'error');
        }
    }

    // ============================================================
    // SOHBET ALANINA GİRİŞ/ÇIKIŞ VE GEÇİŞ
    // ============================================================
    function leaveCurrentChatContext() {
        if (activeChatUnsub) { activeChatUnsub(); activeChatUnsub = null; }
        if (activeRoomMembersUnsub) { activeRoomMembersUnsub(); activeRoomMembersUnsub = null; }
        if (typingUnsub) { typingUnsub(); typingUnsub = null; }
        if (dmPresenceUnsub) { dmPresenceUnsub(); dmPresenceUnsub = null; }
        lastMessageCount = 0;
        cancelReply();
    }

    function switchToChatScreen() {
        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('app-container').classList.remove('hidden');
        document.getElementById('messages').innerHTML = '';
        
        loadStoredWallpaper();

        const shareBtn = document.getElementById('share-room-btn');
        const infoTrigger = document.getElementById('info-trigger');
        const subtitleLabel = document.getElementById('chat-subtitle-label');
        
        if (currentChatType === 'room') {
            shareBtn.classList.remove('hidden');
            infoTrigger.onclick = toggleInfo;
            subtitleLabel.textContent = 'ℹ️ GRUP BİLGİSİ';
        } else {
            shareBtn.classList.add('hidden');
            infoTrigger.onclick = () => openMemberProfile(currentDmUid);

        closeInfoPanel();

        leaveCurrentChatContext();
        currentChatType = null;
        currentRoomId = null;
        currentDmUid = null;
        currentChatId = null;
        document.getElementById('app-container').classList.add('hidden');
        document.getElementById('lobby-screen').classList.remove('hidden');
    }

    async function enterRoomById(roomId) {
        leaveCurrentChatContext();
        try {
            const roomSnap = await getDoc(roomRef(roomId));
            if (!roomSnap.exists()) {
                toast('Oda bulunamadı.', 'error');
                return;
            }
            const roomData = roomSnap.data();
            if (!roomData.members || !roomData.members[myUid]) {
                toast('Bu odaya erişiminiz yok. Önce şifreyle katılın.', 'error');
                openJoinRoomModal();
                setTimeout(() => {
                    const nameInput = document.getElementById('join-room-name');
                    if (nameInput) nameInput.value = roomData.name || roomId;
                }, 300);
                return;
            }
            currentChatType = 'room';
            currentRoomId = roomId;
            currentChatId = 'room_' + roomId;
            currentRoomInfo = { id: roomId, ...roomData };
            
            switchToChatScreen();
            document.getElementById('chat-title').textContent = currentRoomInfo.name;
            document.getElementById('chat-avatar').src = currentRoomInfo.photoURL || defaultAvatar(currentRoomInfo.name);
            document.getElementById('chat-online-badge').classList.add('hidden');
            
            loadRoomMembers(roomId);
            listenToChatMessages();
            listenToTyping();
        } catch (e) {
            toast('Odaya girilemedi.', 'error');
        }
    }

    async function enterDM(otherUid) {
        leaveCurrentChatContext();
        try {
            const userSnap = await getDoc(userRef(otherUid));
            if (!userSnap.exists()) {
                toast('Kullanıcı bulunamadı.', 'error');
                return;
            }
            const otherProfile = userSnap.data();
            
            currentChatType = 'dm';
            currentDmUid = otherUid;
            
            const dmId = [myUid, otherUid].sort().join('_');
            currentChatId = 'dm_' + dmId;

            switchToChatScreen();
            document.getElementById('chat-title').textContent = otherProfile.name;
            document.getElementById('chat-avatar').src = otherProfile.photoURL || defaultAvatar(otherProfile.name);

            updateDmOnlineBadge(otherProfile.lastActive);

            if (dmPresenceUnsub) dmPresenceUnsub();
            dmPresenceUnsub = onSnapshot(userRef(otherUid), (snap) => {
                if (snap.exists()) updateDmOnlineBadge(snap.data().lastActive);
            });

            const dmDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'dms', dmId);
            const sorted = [myUid, otherUid].sort();
            await setDoc(dmDocRef, {
                user1: sorted[0],
                user1_name: sorted[0] === myUid ? myProfile.name : otherProfile.name,
                user1_photo: sorted[0] === myUid ? (myProfile.photoURL || '') : (otherProfile.photoURL || ''),
                user2: sorted[1],
                user2_name: sorted[1] === myUid ? myProfile.name : otherProfile.name,
                user2_photo: sorted[1] === myUid ? (myProfile.photoURL || '') : (otherProfile.photoURL || ''),
                lastMessageAt: Date.now()
            }, { merge: true });

            listenToChatMessages();
            listenToTyping();
        } catch (e) {
            toast('Sohbet açılamadı.', 'error');
        }
    }

    function updateDmOnlineBadge(lastActive) {
        const badge = document.getElementById('chat-online-badge');
        const isOnline = lastActive && (Date.now() - lastActive < 15000);
        if (isOnline) badge.classList.remove('hidden');
        else badge.classList.add('hidden');
    }

    // ============================================================
    // MESAJLARIN DİNLENMESİ VE GÖNDERİLMESİ
    // ============================================================
    function listenToChatMessages() {
        const path = 'messages_' + currentChatId;
        const msgColRef = msgCol(currentChatId);
        
        activeChatUnsub = onSnapshot(msgColRef, (snapshot) => {
            let list = [];
            snapshot.forEach(docSnap => {
                list.push({ id: docSnap.id, ...docSnap.data() });
            });
            
            list.sort((a, b) => a.t - b.t);

            const box = document.getElementById('messages');
            const shouldStick = isNearBottom(box) || list.length <= lastMessageCount;
            const prevCount = lastMessageCount;
            
            messagesCache = {};
            document.getElementById('messages').innerHTML = '';
            
            list.forEach(msg => {
                messagesCache[msg.id] = msg;
                renderMsg(msg.id, msg);
                
                if (msg.uid !== myUid && (!msg.seenBy || !msg.seenBy[myUid])) {
                    setDoc(msgRef(currentChatId, msg.id), {
                        [`seenBy.${myUid}`]: true
                    }, { merge: true }).catch(() => {});
                }
            });

            if (prevCount > 0) {
                list.slice(prevCount).filter(m => m.uid !== myUid).forEach(m => notifyIncoming(m));
            }

            lastMessageCount = list.length;
            
            if (shouldStick) {
                box.scrollTop = box.scrollHeight;
            }
        });
    }

    async function send(extra = {}) {
        const inp = document.getElementById('msg-input');
        const text = inp.value.trim();
        if (!text && !extra.img && !extra.voice && !extra.poll) return;

        const path = 'messages_' + currentChatId;
        const payload = {
            uid: myUid,
            u: myProfile.name,
            photoURL: myProfile.photoURL || '',
            m: text || null,
            img: extra.img || null,
            v: extra.voice || null,
            poll: extra.poll || null,
            t: Date.now(),
            seenBy: { [myUid]: true }
        };

        if (replyContext) {
            payload.replyTo = {
                id: replyContext.id,
                u: replyContext.data.u,
                m: replyContext.data.m || 'Dosya / Görsel'
            };
        }

        try {
            await addDoc(msgCol(currentChatId), payload);
            inp.value = '';
            cancelReply();
            
            await setDoc(typingRef(currentChatId), {
                [`users.${myUid}`]: null
            }, { merge: true });

            if (currentChatType === 'dm') {
                const dmId = [myUid, currentDmUid].sort().join('_');
                const preview = text || (extra.img ? '📷 Fotoğraf' : (extra.voice ? '🎤 Sesli Mesaj' : (extra.poll ? '📊 Anket' : '')));
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dms', dmId), {
                    lastMessage: preview,
                    lastMessageAt: Date.now()
                }, { merge: true });
            }
        } catch (e) {
            toast('Mesaj gönderilemedi.', 'error');
        }
    }

    async function sendImage(inputEl) {
        const file = inputEl.files[0];
        if (!file) return;
        try {
            const dataUrl = await resizeImageFile(file, 900, 0.75);
            send({ img: dataUrl });
        } catch (e) {
            toast('Fotoğraf işlenemedi.', 'error');
        }
        inputEl.value = '';
    }

    // ============================================================
    // MESAJ RENDERING & OKUNDU SİSTEMİ
    // ============================================================
    function renderMsg(id, data) {
        const html = buildMsgHTML(id, data);
        const existing = document.getElementById('msg-' + id);
        
        if (!html) { if (existing) existing.remove(); return; }
        
        const box = document.getElementById('messages');
        if (existing) {
            existing.outerHTML = html;
        } else {
            box.insertAdjacentHTML('beforeend', html);
        }
    }

    function buildMsgHTML(id, data) {
        if (!data) return '';
        if (data.deletedFor && data.deletedFor[myUid]) return '';
        
        const isMe = data.uid === myUid;
        
        if (data.deletedForEveryone) {
            return `
                <div class="flex flex-col max-w-[85%] ${isMe ? 'self-end' : 'self-start'}" id="msg-${id}">
                    <div class="px-3 py-1.5 rounded-2xl bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 italic text-zinc-400 text-xs text-center shadow-sm">
                        🚫 Bu mesaj silindi.
                    </div>
                </div>
            `;
        }

        // Tiklerin Belirlenmesi
        let tickHTML = '';
        if (isMe) {
            const seenByOthers = Object.keys(data.seenBy || {}).filter(uid => uid !== myUid);
            const readCount = seenByOthers.length;
            if (readCount > 0) {
                tickHTML = `<span class="text-blue-500 font-bold ml-1" title="Okundu">✔✔</span>`;
            } else if (currentChatType === 'dm') {
                tickHTML = `<span class="text-zinc-400 ml-1" title="İletildi">✔✔</span>`;
            } else {
                tickHTML = `<span class="text-zinc-400 ml-1" title="Gönderildi">✔</span>`;
            }
        }

        const replyHTML = data.replyTo ? `<div class="border-l-2 border-primary bg-zinc-100 dark:bg-zinc-800 p-1.5 rounded text-xs mb-1"><b>${escapeHTML(data.replyTo.u)}:</b> ${escapeHTML(data.replyTo.m)}</div>` : '';
        const reactionsHTML = data.reactions ? Object.entries(data.reactions).map(([emoji, uids]) => {
            const hasMine = uids[myUid];
            return `<span class="inline-block px-1.5 py-0.5 rounded-full border text-xs cursor-pointer ${hasMine ? 'bg-blue-100 border-primary' : 'bg-white border-zinc-200 text-zinc-800'}" onclick="reactToMessage('${jsStr(id)}','${jsStr(emoji)}')">${emoji} ${Object.keys(uids).length}</span>`;
        }).join('') : '';

        const timeStr = new Date(data.t).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

        let content = '';
        if (data.poll) content += buildPollHTML(id, data.poll);
        if (data.img) content += `<img src="${data.img}" class="rounded-xl max-w-full max-h-60 object-cover cursor-zoom-in" onclick="window.open(this.src)">`;
        if (data.v) content += `<audio src="${data.v}" controls class="max-w-[200px] sm:max-w-[250px] h-9"></audio>`;
        if (data.m) content += `<p class="text-sm whitespace-pre-wrap break-all msg-text">${escapeHTML(data.m)}</p>`;

        return `
            <div class="flex flex-col max-w-[85%] ${isMe ? 'self-end' : 'self-start'} group" id="msg-${id}">
                <div class="flex items-end gap-2 ${isMe ? 'flex-row-reverse' : 'flex-row'}">
                    <div class="p-3 rounded-2xl shadow-sm ${isMe ? 'bg-primary text-white rounded-tr-none' : 'bg-white dark:bg-zinc-900 border border-zinc-100 dark:border-zinc-800 rounded-tl-none'}">
                        ${!isMe && currentChatType === 'room' ? `<span class="block text-[10px] font-bold text-primary dark:text-blue-400 mb-0.5">${escapeHTML(data.u)}</span>` : ''}
                        ${replyHTML}
                        ${content}
                        <div class="flex items-center justify-end gap-1.5 text-[9px] opacity-75 mt-1">
                            ${data.edited ? '<span>düzenlendi</span>' : ''}
                            <span>${timeStr}</span>
                            ${tickHTML}
                        </div>
                    </div>
                    <button onclick="openMessageActions('${jsStr(id)}')" class="opacity-0 group-hover:opacity-100 p-1 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 transition text-xs">⋯</button>
                </div>
                ${reactionsHTML ? `<div class="flex gap-1 flex-wrap mt-1 ${isMe ? 'justify-end' : 'justify-start'}">${reactionsHTML}</div>` : ''}
            </div>
        `;
    }

    // ============================================================
    // MESAJ AKSİYONLARI, REAKSİYON, CEVAPLAMA, DÜZENLEME, SİLME
    // ============================================================
    function openMessageActions(id) {
        const data = messagesCache[id];
        if (!data || data.deletedForEveryone) return;

        const isMine = data.uid === myUid;
        const isAdmin = currentChatType === 'room' && isCurrentUserAdmin();
        const hasText = !!data.m;

        let html = `
            <h3 class="text-sm font-bold text-center mb-3">Mesaj Seçenekleri</h3>
            <div class="flex justify-around mb-4 bg-zinc-100 dark:bg-zinc-800 p-2 rounded-2xl">
                ${REACTIONS.map(emoji => `<button onclick="reactToMessage('${jsStr(id)}','${jsStr(emoji)}')" class="text-2xl hover:scale-125 transition">${emoji}</button>`).join('')}
            </div>
            <button class="w-full text-left py-2.5 px-4 bg-zinc-50 dark:bg-zinc-800 rounded-xl mb-2 text-sm font-semibold hover:bg-zinc-100 transition" onclick="replyToMessage('${jsStr(id)}')">↩️ Yanıtla</button>
        `;

        if (hasText) {
            html += `<button class="w-full text-left py-2.5 px-4 bg-zinc-50 dark:bg-zinc-800 rounded-xl mb-2 text-sm font-semibold hover:bg-zinc-100 transition" onclick="copyMessageText('${jsStr(id)}')">📋 Metni Kopyala</button>`;
        }
        if (isMine && hasText) {
            html += `<button class="w-full text-left py-2.5 px-4 bg-zinc-50 dark:bg-zinc-800 rounded-xl mb-2 text-sm font-semibold text-primary hover:bg-zinc-100 transition" onclick="editMessageStart('${jsStr(id)}')">✏️ Düzenle</button>`;
        }
        
        html += `<button class="w-full text-left py-2.5 px-4 bg-zinc-50 dark:bg-zinc-800 rounded-xl mb-2 text-sm font-semibold text-red-500 hover:bg-zinc-100 transition" onclick="deleteMessageForMe('${jsStr(id)}')">🗑️ Benden Sil</button>`;
        
        if (isMine || isAdmin) {
            html += `<button class="w-full text-left py-2.5 px-4 bg-zinc-50 dark:bg-zinc-800 rounded-xl text-sm font-semibold text-red-500 hover:bg-zinc-100 transition" onclick="deleteMessageForEveryone('${jsStr(id)}')">🗑️ Herkesten Sil</button>`;
        }

        openSheet(html);
    }

    async function reactToMessage(id, emoji) {
        const path = 'messages_' + currentChatId;
        const data = messagesCache[id];
        const currentReactions = data.reactions || {};
        const userMap = currentReactions[emoji] || {};

        if (userMap[myUid]) {
            delete userMap[myUid];
        } else {
            userMap[myUid] = true;
        }

        currentReactions[emoji] = userMap;
        try {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', path, id), { reactions: currentReactions });
            closeSheet();
        } catch (e) {}
    }

    function replyToMessage(id) {
        const data = messagesCache[id];
        if (!data) return;
        replyContext = { id, data };
        const bar = document.getElementById('reply-preview-bar');
        bar.classList.remove('hidden');
        bar.querySelector('.reply-text').textContent = `${data.u}: ${data.m || 'Dosya / Görsel'}`;
        closeSheet();
    }

    function cancelReply() {
        replyContext = null;
        document.getElementById('reply-preview-bar').classList.add('hidden');
    }

    function copyMessageText(id) {
        const data = messagesCache[id];
        if (data && data.m) {

    // ============================================================
    // MÜKEMMELLEŞTİRİLMİŞ SES KAYIT ALTYAPISI
    // ============================================================
    async function startRecording() {
        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
            toast('Mikrofon izni reddedildi.', 'error');
            return;
        }

        mediaRecorder = new MediaRecorder(mediaStream, MediaRecorder.isTypeSupported('audio/webm') ? { mimeType: 'audio/webm' } : undefined);
        audioChunks = [];
        
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            recordedBlobForSend = blob;
            recordedBlobURL = URL.createObjectURL(blob);
            
            document.getElementById('record-bar').classList.add('hidden');
            const previewBar = document.getElementById('voice-preview-bar');
            previewBar.classList.remove('hidden');
            document.getElementById('voice-preview-audio').src = recordedBlobURL;
        };

        mediaRecorder.start();
        recordSeconds = 0;
        updateRecordTimer();
        
        recordTimerInterval = setInterval(() => {
            recordSeconds++;
            updateRecordTimer();
        }, 1000);

        document.getElementById('record-bar').classList.remove('hidden');
        document.getElementById('input-row').classList.add('hidden');
    }

    function updateRecordTimer() {
        const m = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
        const s = String(recordSeconds % 60).padStart(2, '0');
        document.getElementById('record-timer').textContent = `${m}:${s}`;
    }

    function cancelRecording() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.onstop = null;
            mediaRecorder.stop();
        }
        stopAllTracks();
        clearInterval(recordTimerInterval);
        document.getElementById('record-bar').classList.add('hidden');
        document.getElementById('input-row').classList.remove('hidden');
    }

    function stopRecordingAndPreview() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        clearInterval(recordTimerInterval);
        stopAllTracks();
    }

    function discardRecording() {
        document.getElementById('voice-preview-bar').classList.add('hidden');
        document.getElementById('input-row').classList.remove('hidden');
        recordedBlobForSend = null;
        recordedBlobURL = null;
    }

    function sendRecording() {
        const blob = recordedBlobForSend;
        if (!blob) return;
        const reader = new FileReader();
        reader.onloadend = () => {
            send({ voice: reader.result });
            discardRecording();
        };
        reader.readAsDataURL(blob);
    }

    function stopAllTracks() {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
    }

        }
        if (!profile) return;

        const aboutHTML = profile.aboutPublic && profile.about ? `<p class="italic text-zinc-650 dark:text-zinc-350 border border-zinc-100 dark:border-zinc-800 p-3 rounded-xl bg-zinc-50 dark:bg-zinc-850 text-left text-sm">${escapeHTML(profile.about)}</p>` : '<p class="italic text-zinc-400 text-sm">Hakkımda bilgisi paylaşılmamış.</p>';

        const html = `
            <div class="flex flex-col items-center gap-3 text-center">
                <img class="w-20 h-20 rounded-full object-cover border-4 border-primary shadow" src="${profile.photoURL || defaultAvatar(profile.name)}">
                <h4 class="font-bold text-lg">${escapeHTML(profile.name)}</h4>
                ${aboutHTML}
                ${uid !== myUid ? `<button onclick="closeSheet(); enterDM('${jsStr(uid)}')" class="w-full mt-3 py-2.5 bg-primary hover:bg-primary-dark text-white font-bold rounded-xl text-sm transition shadow">💬 Özel Mesaj Gönder</button>` : ''}
            </div>
        `;
        openSheet(html);
    }

    async function shareRoom() {
        const link = window.location.origin + window.location.pathname + '?room=' + encodeURIComponent(currentRoomId);
        const ok = await copyToClipboard(link);
        toast(ok ? 'Grup davet linki kopyalandı!' : 'Link kopyalanamadı.', ok ? 'info' : 'error');
    }

    function toggleDarkMode() {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    bindGlobalHandlers();
    initFirebase();
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bindStaticButtons);
    } else {
        bindStaticButtons();
    }
</script>
</body>
</html>
