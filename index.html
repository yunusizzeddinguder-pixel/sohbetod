<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohbetod Web Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes progress { from { width: 0%; } to { width: 100%; } }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-slide-in { animation: slideIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="bg-[#06080c] text-gray-100 font-sans h-screen w-screen overflow-hidden antialiased">

    <div id="app" class="h-full w-full flex flex-col justify-center items-center">
        <!-- İçerik JavaScript ile Buraya Render Edilecek -->
    </div>

    <script>
        // --- HAFIZA VE EKRAN YÖNETİMİ (STATE) ---
        let user = JSON.parse(localStorage.getItem('sohbetod_user')) || null;
        let authStep = user ? 'app' : 'landing';
        let activeTab = 'chats';
        let activeRoom = null;
        let showProfileSettings = false;
        let showGroupInfoPanel = false;
        let showNewGroupModal = false;
        let showStatusModal = false;
        let showPollModal = false;
        let currentStatusViewer = null;
        let statusViewModal = { show: false, views: [], likes: [] };
        
        let messageText = '';
        let searchQuery = '';
        let newGroupName = '';
        let newGroupAbout = '';
        let newGroupAvatar = '';
        let newStatusText = '';
        let newStatusMedia = null;
        let pollQuestion = '';
        let pollOptions = ['', ''];
        
        let activeMessageMenu = null;
        let replyingMessage = null;
        let aiGeneratingText = false;

        // --- VERİTABANI SİMÜLASYONU ---
        let allUsers = [
            { uid: 'u_alperen', displayName: 'Alperen Şahin', email: 'alperen@gmail.com', photoURL: 'logo.jpg', about: 'Siber Güvenlik Uzmanı' },
            { uid: 'u_ece', displayName: 'Ece Yalçın', email: 'ece@gmail.com', photoURL: 'logo.jpg', about: 'Tasarım her şeydir' },
            { uid: 'u_mert', displayName: 'Mert Aksoy', email: 'mert@gmail.com', photoURL: 'logo.jpg', about: 'Kodluyorum...' }
        ];

        let rooms = [
            { id: 'sohbetod-ai-assistant', name: '🤖 Sohbetod AI Asistanı', type: 'ai', photoURL: 'logo.jpg', lastMessage: 'Sohbetod asistanınız aktif. Her sorunuzu yanıtlamaya hazırım.', lastMessageTime: new Date().toISOString() },
            { id: 'feedback-room', name: '📢 Şikayet ve Öneriler', type: 'system', photoURL: 'logo.jpg', lastMessage: 'Görüşleriniz otomatik olarak yunusizzeddinguder@gmail.com adresine iletilir.', lastMessageTime: new Date(Date.now() - 1000).toISOString() },
            { id: 'room_global', name: 'Geliştiriciler Odası 💎', type: 'public', about: 'Sohbetod resmi test odasıdır.', photoURL: 'logo.jpg', participants: ['u_alperen', 'u_ece', 'u_mert'], joinRequests: [], creator: 'u_alperen', admins: ['u_alperen'], lastMessage: 'Test grubu aktiftir.', lastMessageTime: new Date().toISOString() }
        ];

        let messages = [
            { id: 'm1', roomId: 'sohbetod-ai-assistant', senderId: 'ai', senderName: 'Sohbetod AI', text: 'Merhaba! Ben Sohbetod AI Asistanı. Size nasıl yardımcı olabilirim?', timestamp: new Date().toISOString(), type: 'text' },
            { id: 'm2', roomId: 'feedback-room', senderId: 'system', senderName: 'Sistem', text: 'Tüm mesajlarınız yunusizzeddinguder@gmail.com adresine yönlendirilir.', timestamp: new Date().toISOString(), type: 'text' }
        ];

        let statusUpdates = [
            { id: 'st1', userId: 'u_alperen', userName: 'Alperen Şahin', userAvatar: 'logo.jpg', content: 'Sistem güvenliği maksimum seviyede.', mediaUrl: null, mediaType: null, viewers: [], likes: [], timestamp: new Date().toISOString() }
        ];

        // --- SES EFEKTİ ---
        function playSynthSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'sent') {
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'received') {
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.12);
                }
            } catch (e) {}
        }

        function showToast(msg) {
            alert("Sistem: " + msg);
        }

        // --- ANA ÇİZİM (RENDER) FONKSİYONU ---
        function render() {
            // Aktif input odaklanmasını korumak için
            let activeInputId = document.activeElement ? document.activeElement.id : null;
            
            const appDiv = document.getElementById('app');

            if (authStep === 'landing') {
                appDiv.innerHTML = `
                    <div class="flex flex-col items-center justify-center w-full h-full bg-gradient-to-tr from-[#0a0715] via-[#05070a] to-[#0c1820] relative p-4 animate-fade-in">
                        <div class="p-8 text-center bg-slate-950/45 backdrop-blur-2xl rounded-3xl border border-white/5 max-w-md w-full relative z-10">
                            <img src="logo.jpg" alt="Logo" class="w-28 h-28 rounded-full border-2 border-cyan-500/50 shadow-2xl mx-auto mb-6 object-cover">
                            <h1 class="text-5xl font-extrabold bg-gradient-to-r from-cyan-400 via-blue-400 to-purple-400 bg-clip-text text-transparent mb-3 tracking-tight">Sohbetod</h1>
                            <p class="text-cyan-100/70 mb-8 text-sm font-medium px-4">Dosya paylaşımı, Durumlar, Sohbetod AI ve Gelişmiş Gruplarla iletişim ağınız.</p>
                            <button onclick="changeAuthStep('login')" class="w-full bg-white hover:bg-cyan-50 text-slate-950 font-bold py-3.5 px-6 rounded-xl shadow-lg transition-all cursor-pointer">Ağa Katıl</button>
                        </div>
                    </div>
                `;
                return;
            }

            if (authStep === 'login') {
                appDiv.innerHTML = `
                    <div class="flex flex-col items-center justify-center w-full h-full bg-[#05070a] p-4 animate-fade-in">
                        <div class="w-full max-w-md p-8 bg-[#0c0f16] border border-slate-800 shadow-2xl rounded-3xl text-center">
                            <img src="logo.jpg" class="w-16 h-16 rounded-full mx-auto mb-4 border-2 border-cyan-500/40 object-cover">
                            <h2 class="text-2xl font-bold text-gray-100">Kimlik Doğrulama</h2>
                            <div class="space-y-5 mt-6 text-left">
                                <div>
                                    <label class="block text-xs font-bold text-cyan-400 mb-1.5 uppercase">E-Posta</label>
                                    <input type="email" id="emailInput" placeholder="ornek@gmail.com" class="w-full px-4 py-3 border border-slate-800 bg-[#06080d] rounded-xl text-sm text-gray-100 focus:outline-none focus:border-cyan-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-cyan-400 mb-1.5 uppercase">Kullanıcı Adı</label>
                                    <input type="text" id="nameInput" placeholder="Benzersiz isim..." class="w-full px-4 py-3 border border-slate-800 bg-[#06080d] rounded-xl text-sm text-gray-100 focus:outline-none focus:border-cyan-500">
                                </div>
                                <div class="flex justify-between items-center pt-4">
                                    <button onclick="changeAuthStep('landing')" class="text-gray-400 hover:text-white text-xs font-semibold cursor-pointer">İptal</button>
                                    <button onclick="loginUser()" class="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 text-white font-bold py-2.5 px-8 rounded-xl text-sm cursor-pointer">Giriş Yap</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            // --- DASHBOARD ---
            let sidebarHidden = activeRoom ? 'hidden md:flex' : 'flex';
            let chatHidden = activeRoom ? 'flex' : 'hidden md:flex';

            // Odalar Listesi
            let roomListHTML = rooms.map(room => {
                let isParticipant = room.participants && room.participants.includes(user.uid);
                let isSystemOrAi = room.type === 'system' || room.type === 'ai';
                if (!isParticipant && !isSystemOrAi) return ''; // Sadece içinde olduğum odaları göster

                let activeClass = activeRoom && activeRoom.id === room.id ? 'bg-[#111622] border-l-4 border-cyan-500' : 'border-l-4 border-transparent';
                return `
                    <div onclick="selectRoom('${room.id}')" class="flex items-center gap-3 p-4 cursor-pointer hover:bg-slate-800/40 transition-all ${activeClass}">
                        <div class="relative w-12 h-12 rounded-full flex items-center justify-center border border-slate-700 overflow-hidden shrink-0">
                            <img src="${room.photoURL}" onerror="this.src='logo.jpg'" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-baseline mb-1">
                                <h5 class="font-bold text-sm text-gray-100 truncate">${room.name}</h5>
                            </div>
                            <p class="text-xs text-gray-400 truncate">${room.lastMessage || ''}</p>
                        </div>
                    </div>
                `;
            }).join('');

            // Aktif Oda Mesajları
            let activeRoomMessages = messages.filter(m => m.roomId === (activeRoom ? activeRoom.id : '') && !(m.deletedFor && m.deletedFor.includes(user.uid)));
            let messagesHTML = activeRoomMessages.map(msg => {
                let isMe = msg.senderId === user.uid;
                let isSystem = msg.senderId === 'system';
                
                if(isSystem) {
                    return `<div class="flex justify-center my-2"><div class="bg-slate-800/80 text-gray-300 text-[11px] px-4 py-1.5 rounded-full">${msg.text}</div></div>`;
                }

                let alignment = isMe ? 'ml-auto bg-gradient-to-br from-[#1b2b38] to-[#121c25] rounded-tr-sm border border-cyan-900/30' : 'mr-auto bg-gradient-to-br from-[#121821] to-[#0c1016] rounded-tl-sm border border-slate-800/60';
                
                let replyHTML = msg.replyToSender ? `
                    <div class="mb-2 bg-black/30 p-2 rounded border-l-2 border-cyan-400 text-xs text-gray-300">
                        <span class="font-bold block text-cyan-400">${msg.replyToSender}</span>
                        <span class="italic truncate block">${msg.replyToText}</span>
                    </div>
                ` : '';

                let contentHTML = '';
                if (msg.isDeleted) {
                    contentHTML = `<div class="text-[13px] text-gray-500 italic flex items-center gap-1"><i data-lucide="lock" class="w-3 h-3"></i> Bu mesaj silindi.</div>`;
                } else {
                    if (msg.type === 'image') contentHTML += `<img src="${msg.mediaUrl}" class="mb-2 rounded-lg max-h-60 object-contain w-full">`;
                    if (msg.type === 'video') contentHTML += `<video src="${msg.mediaUrl}" controls class="mb-2 rounded-lg max-h-60 w-full"></video>`;
                    if (msg.type === 'document') contentHTML += `<a href="${msg.mediaUrl}" download="${msg.text}" class="flex items-center gap-2 bg-slate-900 p-3 rounded-lg mb-2 text-cyan-400 text-xs hover:underline border border-slate-700"><i data-lucide="file-text" class="w-6 h-6"></i> ${msg.text}</a>`;
                    
                    if (msg.type === 'poll') {
                        let totalVotes = Object.keys(msg.pollData.votes || {}).length;
                        contentHTML += `
                            <div class="bg-slate-900/50 p-3 rounded-xl border border-cyan-500/20 mb-2 w-full min-w-[200px]">
                                <h5 class="font-bold text-xs text-white mb-2 flex items-center gap-1"><i data-lucide="bar-chart-2" class="w-4 h-4 text-cyan-400"></i> ${msg.pollData.question}</h5>
                                <div class="space-y-1.5">
                                    ${msg.pollData.options.map((opt, i) => {
                                        let optVotes = Object.values(msg.pollData.votes || {}).filter(v => v === i).length;
                                        let pct = totalVotes === 0 ? 0 : Math.round((optVotes / totalVotes) * 100);
                                        let isMyVote = (msg.pollData.votes || {})[user.uid] === i;
                                        return `
                                            <div onclick="votePoll('${msg.id}', ${i})" class="relative overflow-hidden rounded border ${isMyVote ? 'border-cyan-500 bg-cyan-900/30' : 'border-slate-700 bg-slate-800'} p-2 cursor-pointer transition-colors">
                                                <div class="absolute top-0 left-0 h-full bg-cyan-600/20" style="width: ${pct}%"></div>
                                                <div class="relative z-10 flex justify-between text-xs text-gray-200">
                                                    <span>${opt}</span><span class="font-mono text-cyan-400">${pct}% (${optVotes})</span>
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        `;
                    }
                    if (msg.type === 'text') contentHTML += `<div class="text-[13px] break-words">${msg.text}</div>`;
                }

                // Mesaj Menüsü
                let menuDropdown = activeMessageMenu === msg.id && !msg.isDeleted ? `
                    <div class="absolute right-0 bottom-6 w-36 bg-[#111622] border border-slate-700 rounded-lg shadow-xl z-20 py-1">
                        <button onclick="confirmDelete('${msg.id}', false)" class="w-full text-left px-4 py-2 text-xs text-gray-300 hover:bg-slate-800 cursor-pointer">Benden Sil</button>
                        ${isMe ? `<button onclick="confirmDelete('${msg.id}', true)" class="w-full text-left px-4 py-2 text-xs text-rose-400 hover:bg-slate-800 cursor-pointer">Herkesten Sil</button>` : ''}
                    </div>
                ` : '';

                return `
                    <div class="flex flex-col max-w-[75%] rounded-2xl px-4 py-2.5 relative shadow-md group ${alignment}">
                        ${(!isMe && activeRoom.type === 'public') ? `<div class="text-[10px] font-bold text-cyan-400 mb-1 flex items-center gap-1"><img src="logo.jpg" class="w-4 h-4 rounded-full"> ${msg.senderName}</div>` : ''}
                        ${replyHTML}
                        ${contentHTML}
                        <div class="flex items-center justify-end gap-2 mt-1.5 text-[9px] text-gray-500 relative">
                            <span>${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                            ${!msg.isDeleted ? `
                                <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onclick="setReplyMessage('${msg.id}')" class="hover:text-cyan-400 cursor-pointer"><i data-lucide="corner-up-left" class="w-3 h-3"></i></button>
                                    <button onclick="toggleMessageMenu('${msg.id}')" class="hover:text-white cursor-pointer"><i data-lucide="more-vertical" class="w-3 h-3"></i></button>
                                </div>
                                ${menuDropdown}
                            ` : ''}
                            ${(isMe && !msg.isDeleted) ? `<i data-lucide="check-check" class="w-3 h-3 text-cyan-500 ml-1"></i>` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            // --- KİŞİLER (KEŞFET) TAB ---
            let usersHTML = `
                <div class="p-2 space-y-4">
                    <div>
                        <h6 class="text-[10px] font-bold text-gray-500 uppercase px-2 mb-2">Genel Gruplar</h6>
                        <div class="divide-y divide-slate-800/20">
                            ${rooms.filter(r => r.type === 'public' && (!r.participants || !r.participants.includes(user.uid))).map(room => `
                                <div class="flex items-center justify-between p-3 bg-slate-800/10 rounded-xl mb-1">
                                    <div class="flex items-center gap-3">
                                        <img src="${room.photoURL}" onerror="this.src='logo.jpg'" class="w-10 h-10 rounded-xl object-cover">
                                        <div><h5 class="font-bold text-sm text-gray-100">${room.name}</h5><p class="text-[10px] text-gray-400">${room.participants ? room.participants.length : 0} Üye</p></div>
                                    </div>
                                    ${(room.joinRequests && room.joinRequests.includes(user.uid)) ? 
                                        `<span class="text-[10px] text-amber-400 border border-amber-500/30 px-2 py-1 rounded">İstek Gönderildi</span>` : 
                                        `<button onclick="requestToJoinGroup('${room.id}')" class="text-[11px] bg-cyan-600 text-white px-3 py-1.5 rounded-lg hover:bg-cyan-500 cursor-pointer">Katıl</button>`
                                    }
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div>
                        <h6 class="text-[10px] font-bold text-gray-500 uppercase px-2 mb-2">Sohbetod Kullanıcıları</h6>
                        <div class="divide-y divide-slate-800/20">
                            ${allUsers.map(targetUser => `
                                <div onclick="startDirectChat('${targetUser.uid}')" class="flex items-center justify-between p-3 bg-slate-800/10 hover:bg-slate-800/30 rounded-xl mb-1 cursor-pointer">
                                    <div class="flex items-center gap-3">
                                        <img src="${targetUser.photoURL}" onerror="this.src='logo.jpg'" class="w-10 h-10 rounded-full object-cover">
                                        <div>
                                            <h5 class="font-bold text-sm text-gray-100">${targetUser.displayName}</h5>
                                            <p class="text-[10px] text-gray-400 truncate max-w-[150px]">${targetUser.about || targetUser.email}</p>
                                        </div>
                                    </div>
                                    <i data-lucide="message-square" class="w-4 h-4 text-gray-500"></i>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;

            // --- DURUMLAR TAB ---
            // Durumları kullanıcı bazında grupla
            let statusGroups = {};
            statusUpdates.forEach(st => {
                if(!statusGroups[st.userId]) statusGroups[st.userId] = { userId: st.userId, userName: st.userName, userAvatar: st.userAvatar, updates: [] };
                statusGroups[st.userId].updates.push(st);
            });
            let myStatus = statusGroups[user.uid];

            let statusHTML = `
                <div class="p-4 space-y-4">
                    <div class="flex items-center gap-4 pb-4 border-b border-slate-800/80">
                        <div onclick="openStatusModal(true)" class="relative w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center cursor-pointer border border-slate-700 overflow-hidden">
                            <img src="${user.photoURL}" onerror="this.src='logo.jpg'" class="w-full h-full object-cover">
                            <div class="absolute -bottom-1 -right-1 p-0.5 bg-cyan-500 rounded-full text-slate-950"><i data-lucide="plus" class="w-3 h-3"></i></div>
                        </div>
                        <div>
                            <h5 class="font-bold text-sm text-gray-100">Durumum</h5>
                            <p class="text-xs text-gray-400">Resim, video veya yazı paylaşın</p>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <h6 class="text-[10px] font-bold text-gray-500 uppercase px-1">Bağlantıların Durumları</h6>
                        ${Object.values(statusGroups).filter(s => s.userId !== user.uid).map(sg => `
                            <div onclick="viewStatus('${sg.userId}')" class="flex items-center gap-3 p-2.5 rounded-xl cursor-pointer hover:bg-slate-800/40">
                                <div class="w-10 h-10 rounded-full border-[3px] border-cyan-400 border-dashed p-0.5 animate-[spin_10s_linear_infinite]">
                                    <img src="${sg.userAvatar}" onerror="this.src='logo.jpg'" class="w-full h-full rounded-full object-cover">
                                </div>
                                <div>
                                    <h5 class="font-bold text-sm text-gray-200">${sg.userName}</h5>
                                    <span class="text-[10px] text-gray-500">${sg.updates.length} Paylaşım</span>
                                </div>
                            </div>
                        `).join('')}

                        ${myStatus ? `
                            <div class="pt-4">
                                <h6 class="text-[10px] font-bold text-cyan-500 uppercase px-1 mb-2">Benim Paylaşımlarım</h6>
                                ${myStatus.updates.map(upd => `
                                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-800/20 mb-1 border border-slate-800">
                                        <div class="flex items-center gap-2">
                                            ${upd.mediaType === 'image' ? '<i data-lucide="image" class="w-4 h-4 text-gray-400"></i>' : upd.mediaType === 'video' ? '<i data-lucide="video" class="w-4 h-4 text-gray-400"></i>' : '<i data-lucide="file-text" class="w-4 h-4 text-gray-400"></i>'}
                                            <span class="text-xs text-gray-300 truncate max-w-[150px]">${upd.content || 'Medya Paylaşımı'}</span>
                                        </div>
                                        <button onclick="viewStatusLikes('${upd.id}')" class="text-[10px] text-cyan-400 flex items-center gap-1 bg-cyan-900/30 px-2 py-1 rounded cursor-pointer">
                                            <i data-lucide="eye" class="w-3 h-3"></i> ${upd.viewers.length}
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;

            // ANA LAYOUT
            appDiv.innerHTML = `
                <div class="flex h-full w-full">
                    <!-- SIDEBAR -->
                    <div class="${sidebarHidden} w-full md:w-[380px] flex-col border-r border-slate-800/80 h-full bg-[#0a0d14]">
                        <div class="p-4 flex justify-between items-center bg-[#0c0f16] border-b border-slate-800/80">
                            <div onclick="toggleProfileSettings(true)" class="flex items-center gap-3 cursor-pointer">
                                <img src="${user.photoURL}" onerror="this.src='logo.jpg'" class="w-10 h-10 rounded-full object-cover border border-slate-700">
                                <div class="min-w-0">
                                    <h4 class="font-bold text-sm text-gray-100 truncate">${user.displayName}</h4>
                                    <p class="text-[10px] text-teal-400 flex items-center gap-1"><span class="w-1.5 h-1.5 bg-teal-400 rounded-full animate-pulse"></span> Çevrimiçi</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="openNewGroupModal(true)" class="p-2 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 rounded-full cursor-pointer"><i data-lucide="plus" class="w-4 h-4"></i></button>
                                <button onclick="logoutApp()" class="p-2 hover:bg-red-500/10 text-red-400 rounded-full cursor-pointer"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                            </div>
                        </div>

                        <!-- TAB SELECTION -->
                        <div class="flex bg-[#0b0e14] border-b border-slate-800 text-[11px] font-bold uppercase tracking-wider">
                            <button onclick="switchTab('chats')" class="flex-1 py-3 text-center cursor-pointer ${activeTab === 'chats' ? 'border-b-2 border-cyan-400 text-cyan-400 bg-cyan-500/5' : 'text-gray-500 hover:text-gray-300'}">Sohbetler</button>
                            <button onclick="switchTab('status')" class="flex-1 py-3 text-center cursor-pointer ${activeTab === 'status' ? 'border-b-2 border-cyan-400 text-cyan-400 bg-cyan-500/5' : 'text-gray-500 hover:text-gray-300'}">Durumlar</button>

                input.focus();
                // Move cursor to end
                if(input.value) { let val = input.value; input.value = ''; input.value = val; }
            }

            const end = document.getElementById('messagesEnd');
            if(end) end.scrollIntoView();
        }

        // --- GLOBAL ACTIONS (BUTON FONKSİYONLARI) ---
        // Tüm bu fonksiyonlar onclick içerisinde temizce çalışacak

        function changeAuthStep(step) { authStep = step; render(); }
        function switchTab(tab) { activeTab = tab; render(); }
        function toggleProfileSettings(show) { showProfileSettings = show; render(); }
        function toggleGroupInfo(show) { showGroupInfoPanel = show; render(); }
        function openNewGroupModal(show = true) { showNewGroupModal = show; newGroupName=''; newGroupAbout=''; render(); }
        function openPollModal(show = true) { showPollModal = show; pollQuestion=''; pollOptions=['','']; render(); }
        function openStatusModal(show = true) { showStatusModal = show; newStatusText=''; newStatusMedia=null; render(); }
        function closeRoom() { activeRoom = null; replyingMessage = null; render(); }
        function cancelReply() { replyingMessage = null; render(); }
        function closeStatusViewer() { currentStatusViewer = null; render(); }
        function closeStatusViews() { statusViewModal = { show: false, views: [], likes: [] }; render(); }
        function removeStatusMedia() { newStatusMedia = null; render(); }
        function toggleMessageMenu(msgId) { activeMessageMenu = activeMessageMenu === msgId ? null : msgId; render(); }

        function loginUser() {
            let email = document.getElementById('emailInput').value.trim();
            let name = document.getElementById('nameInput').value.trim();
            if(!email || !name) return;
            user = { uid: 'u_' + Date.now(), displayName: name, email: email, photoURL: 'logo.jpg', about: 'Sohbetod Web Kullanıyor' };
            localStorage.setItem('sohbetod_user', JSON.stringify(user));
            authStep = 'app';
            render();
        }

        function logoutApp() {
            localStorage.removeItem('sohbetod_user');
            user = null; authStep = 'landing'; activeRoom = null;
            render();
        }

        function selectRoom(id) {
            activeRoom = rooms.find(r => r.id === id);
            replyingMessage = null;
            render();
        }

        function handleChatSubmit(e) {
            e.preventDefault();
            let input = document.getElementById('msgTextInput');
            if(!input) return;
            let raw = input.value.trim();
            if(!raw) return;
            
            let msg = { id: 'm_' + Date.now(), roomId: activeRoom.id, senderId: user.uid, senderName: user.displayName, text: raw, timestamp: new Date().toISOString(), type: 'text' };
            if (replyingMessage) {
                msg.replyToSender = replyingMessage.senderName;
                msg.replyToText = replyingMessage.text;
                replyingMessage = null;
            }
            messages.push(msg);
            activeRoom.lastMessage = raw;
            playSynthSound('sent');

            // Feedback Odası Maile Yönlendirme
            if (activeRoom.id === 'feedback-room') {
                setTimeout(() => {
                    let subject = encodeURIComponent("Sohbetod Şikayet/Öneri - " + user.displayName);
                    let body = encodeURIComponent("Kullanıcı: " + user.displayName + "\nE-posta: " + user.email + "\n\nMesaj: " + raw);
                    window.location.href = `mailto:yunusizzeddinguder@gmail.com?subject=${subject}&body=${body}`;
                    
                    messages.push({ id: 'sys_' + Date.now(), roomId: 'feedback-room', senderId: 'system', senderName: 'Sistem', text: 'Mesajınız cihazınızın mail uygulaması üzerinden yunusizzeddinguder@gmail.com adresine aktarılıyor.', timestamp: new Date().toISOString(), type: 'text' });
                    render();
                }, 500);
            }

            // AI Entegrasyonu
            if (activeRoom.type === 'ai') {
                aiGeneratingText = true;
                render();
                setTimeout(() => {
                    aiGeneratingText = false;
                    messages.push({ id: 'ai_' + Date.now(), roomId: activeRoom.id, senderId: 'ai', senderName: 'Sohbetod AI Asistanı', text: '"' + raw + '" sorunuzu anladım. Size en iyi şekilde yardımcı olmak için buradayım. (HTML ortamında yapay zeka simüle edilmektedir).', timestamp: new Date().toISOString(), type: 'text' });
                    activeRoom.lastMessage = "Yapay zeka yanıtladı.";
                    playSynthSound('received');
                    render();
                }, 1500);
            } else {
                render();
            }
        }

        function uploadFile(e) {
            let file = e.target.files[0];
            if(!file) return;
            if(file.size > 2000000) { showToast("Dosya çok büyük (Maks 2MB)!"); return; }
            let reader = new FileReader();
            reader.onload = function(ev) {
                let type = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : 'document';
                messages.push({ id: 'f_' + Date.now(), roomId: activeRoom.id, senderId: user.uid, senderName: user.displayName, text: file.name, mediaUrl: ev.target.result, type: type, timestamp: new Date().toISOString() });
                activeRoom.lastMessage = "📎 " + file.name;
                playSynthSound('sent');
                render();
            };
            reader.readAsDataURL(file);
        }

        function startDirectChat(uid) {
            let target = allUsers.find(u => u.uid === uid);
            let exist = rooms.find(r => r.type === 'direct' && r.participants && r.participants.includes(target.uid) && r.participants.includes(user.uid));
            if(exist) { activeRoom = exist; } 
            else {
                let nRoom = { id: 'rm_' + Date.now(), name: target.displayName, type: 'direct', photoURL: target.photoURL, participants: [user.uid, target.uid], lastMessage: 'Sohbet oluşturuldu.', lastMessageTime: new Date().toISOString() };
                rooms.push(nRoom); activeRoom = nRoom;
            }
            activeTab = 'chats'; render();
        }

        function inviteUserByGmail() {
            let em = document.getElementById('inviteEmailInput').value.trim().toLowerCase();
            if(!em) return;
            let target = allUsers.find(u => u.email.toLowerCase() === em);
            if(target) {
                if(!activeRoom.participants) activeRoom.participants = [];
                if(activeRoom.participants.includes(target.uid)) {
                    showToast("Kullanıcı zaten grupta!");
                } else {
                    activeRoom.participants.push(target.uid);
                    messages.push({ id: 'sys_'+Date.now(), roomId: activeRoom.id, senderId: 'system', senderName: 'Sistem', text: target.displayName + ' gruba eklendi.', timestamp: new Date().toISOString(), type: 'text' });
                    showToast(target.displayName + " başarıyla eklendi!");
                }
            } else {
                showToast("Sistemde bu e-posta ile kayıtlı kullanıcı bulunamadı.");
            }
            document.getElementById('inviteEmailInput').value = '';
            render();
        }

        function createNewGroupSubmit() {
            let name = document.getElementById('newGroupNameInput').value.trim();
            let about = document.getElementById('newGroupAboutInput').value.trim();
            if(!name) return;
            let nRoom = { id: 'rm_' + Date.now(), name: name, type: 'public', about: about, photoURL: 'logo.jpg', participants: [user.uid], creator: user.uid, admins: [user.uid], joinRequests: [], lastMessage: 'Grup kuruldu.', lastMessageTime: new Date().toISOString() };
            rooms.push(nRoom); activeRoom = nRoom;
            showNewGroupModal = false; render();
        }

        function createPollSubmit() {
            let q = document.getElementById('pollQuestionInput').value.trim();
            let o1 = document.getElementById('pollOpt1').value.trim();
            let o2 = document.getElementById('pollOpt2').value.trim();
            if(!q || !o1 || !o2) return;
            messages.push({ id: 'p_' + Date.now(), roomId: activeRoom.id, senderId: user.uid, senderName: user.displayName, type: 'poll', pollData: { question: q, options: [o1, o2], votes: {} }, timestamp: new Date().toISOString() });
            activeRoom.lastMessage = "📊 Anket paylaşıldı.";
            playSynthSound('sent');
            showPollModal = false; render();
        }

        function votePoll(msgId, idx) {
            let m = messages.find(msg => msg.id === msgId);
            if(m && m.pollData) {
                m.pollData.votes = m.pollData.votes || {};
                m.pollData.votes[user.uid] = idx;
                render();
            }
        }

        function uploadStatusMedia(e) {
            let file = e.target.files[0];
            if(!file) return;
            let reader = new FileReader();
            reader.onload = function(ev) {
                newStatusMedia = { url: ev.target.result, type: file.type.startsWith('video/') ? 'video' : 'image' };
                render();
            };
            reader.readAsDataURL(file);
        }

        function shareStatusSubmit() {
            let txt = document.getElementById('statusTextInput').value.trim();
            if(!txt && !newStatusMedia) return;
            statusUpdates.push({ id: 'st_' + Date.now(), userId: user.uid, userName: user.displayName, userAvatar: user.photoURL, content: txt, mediaUrl: newStatusMedia ? newStatusMedia.url : null, mediaType: newStatusMedia ? newStatusMedia.type : null, viewers: [], likes: [], timestamp: new Date().toISOString() });
            showStatusModal = false; render();
        }

        function viewStatus(uid) {
            let userStats = statusUpdates.filter(s => s.userId === uid);
            if(userStats.length > 0) {
                currentStatusViewer = { userId: uid, userName: userStats[0].userName, userAvatar: userStats[0].userAvatar, updates: userStats };
                // Kendi durumum değilse görüldü ekle
                if(uid !== user.uid) {
                    userStats.forEach(st => {
                        if(!st.viewers.includes(user.uid)) st.viewers.push(user.uid);
                    });
                }
                render();
            }
        }

        function likeStatus(stId) {
            let st = statusUpdates.find(s => s.id === stId);
            if(st) {
                if(!st.likes.includes(user.uid)) {
                    st.likes.push(user.uid);
                } else {
                    st.likes = st.likes.filter(id => id !== user.uid);
                }
                render();
            }
        }

        function viewStatusLikes(stId) {
            let st = statusUpdates.find(s => s.id === stId);
            if(st) {
                statusViewModal = { show: true, views: st.viewers, likes: st.likes };
                render();
            }
        }

        function confirmDelete(msgId, forEveryone) {
            let msg = messages.find(m => m.id === msgId);
            if (forEveryone) {
                msg.isDeleted = true;
                msg.text = '🚫 Bu mesaj silindi.';
                msg.mediaUrl = null;
                msg.pollData = null;
            } else {
                msg.deletedFor = msg.deletedFor || [];
                msg.deletedFor.push(user.uid);
            }
            activeMessageMenu = null;
            render();
        }

        function setReplyMessage(id) {
            replyingMessage = messages.find(m => m.id === id);
            render();
        }

        function leaveGroup() {
            if(!activeRoom.participants) return;
            activeRoom.participants = activeRoom.participants.filter(id => id !== user.uid);
            messages.push({ id: 'sys_'+Date.now(), roomId: activeRoom.id, senderId: 'system', senderName: 'Sistem', text: user.displayName + ' gruptan ayrıldı.', timestamp: new Date().toISOString(), type: 'text' });
            activeRoom = null; showGroupInfoPanel = false;
            render();
        }

        function updateProfilePic(e) {
            let file = e.target.files[0];
            if(!file) return;
            let reader = new FileReader();
            reader.onload = function(ev) {
                user.photoURL = ev.target.result;
                localStorage.setItem('sohbetod_user', JSON.stringify(user));
                render();
            };
            reader.readAsDataURL(file);
        }

        function updateGroupAvatar(e) {
            let file = e.target.files[0];
            if(!file) return;
            let reader = new FileReader();
            reader.onload = function(ev) {
                activeRoom.photoURL = ev.target.result;
                render();
            };
            reader.readAsDataURL(file);
        }

        function editAbout() {
            let n = prompt("Hakkında bilginiz:", user.about);
            if(n) {
                user.about = n;
                localStorage.setItem('sohbetod_user', JSON.stringify(user));
                render();
            }
        }

        // Gruba Katılma ve Onay Sistemi
        function requestToJoinGroup(roomId) {
            let r = rooms.find(room => room.id === roomId);
            if(r) {
                if(!r.joinRequests) r.joinRequests = [];
                if(!r.joinRequests.includes(user.uid)) r.joinRequests.push(user.uid);
                showToast("Katılma isteği yöneticilere gönderildi.");
                render();
            }
        }

        function approveJoinRequest(roomId, uid) {
            let r = rooms.find(room => room.id === roomId);
            if(r) {
                r.joinRequests = r.joinRequests.filter(id => id !== uid);
                r.participants.push(uid);
                let target = allUsers.find(u => u.uid === uid) || { displayName: 'Kullanıcı' };
                messages.push({ id: 'sys_'+Date.now(), roomId: roomId, senderId: 'system', senderName: 'Sistem', text: target.displayName + ' gruba katıldı.', timestamp: new Date().toISOString(), type: 'text' });
                showToast("Kullanıcı onaylandı.");
                render();
            }
        }

        function rejectJoinRequest(roomId, uid) {
            let r = rooms.find(room => room.id === roomId);
            if(r) {
                r.joinRequests = r.joinRequests.filter(id => id !== uid);
                showToast("İstek reddedildi.");
                render();
            }
        }

        // --- İLK ÇALIŞTIRMA ---
        render();
    </script>
</body>
</html>
