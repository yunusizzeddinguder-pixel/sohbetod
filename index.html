
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sohbetod Web Pro V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulseSoft { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-slide-in { animation: slideIn 0.2s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        .animate-pulse-soft { animation: pulseSoft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-pop { animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-recording { animation: pulseRed 1.5s infinite; background-color: #ef4444 !important; color: white !important; }
        
        .glass-panel { background: rgba(12, 15, 22, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        
        /* Audio player custom styling to blend with dark theme */
        audio { filter: sepia(20%) saturate(70%) grayscale(1) contrast(99%) invert(12%); height: 35px; outline: none; }
        audio::-webkit-media-controls-panel { background-color: #1e293b; color: white; }
    </style>
</head>
<body class="bg-[#06080c] text-gray-100 font-sans h-screen w-screen overflow-hidden antialiased relative selection:bg-cyan-500/30">

    <!-- Başlangıç Ekranı -->
    <div id="app" class="h-full w-full flex flex-col justify-center items-center">
        <div class="flex flex-col items-center justify-center h-full w-full bg-[#05070a]">
            <div class="w-20 h-20 rounded-full border-t-4 border-cyan-500 border-opacity-50 animate-spin mb-4 shadow-[0_0_15px_rgba(6,182,212,0.5)]"></div>
            <p class="text-cyan-400 font-bold text-sm tracking-widest animate-pulse-soft">SOHBETOD BAŞLATILIYOR...</p>
        </div>
    </div>

    <!-- Bildirimler -->
    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sohbetod-pro-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "mock-key", projectId: "mock-project"
        };
        
        let app, auth, dbFirestore;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            dbFirestore = getFirestore(app);
        } catch (e) {
            console.warn("Firebase başlatılamadı, simülasyon modundayız.");
        }

        window.db = {
            users: [], 
            rooms: [
                { id: 'sys_ai', name: 'Sohbetod AI Asistanı', type: 'ai', photoURL: 'logo.jpg', about: 'Sohbetod Resmi Yapay Zekası', participants: ['system'], creator: 'system', admins: [] },
                { id: 'sys_feedback', name: 'Şikayet ve Öneriler', type: 'system', photoURL: 'logo.jpg', about: 'Yönetime Ulaşın', participants: ['system'], creator: 'system', admins: [] }
            ],
            messages: [],
            statusUpdates: [],
            notifications: [],
            feedbacks: []
        };

        window.currentUserUid = localStorage.getItem('sohbetod_current_uid') || null;
        window.user = null;
        window.authStep = 'landing'; 
        
        window.activeTab = 'chats'; 
        window.activeRoom = null;
        window.activeToasts = []; 
        window.chatSearchQuery = ''; 
        window.searchType = 'user'; 

        // Modeller & Durumlar
        window.showNewGroupModal = false;
        window.showStatusModal = false;
        window.statusViewModal = { show: false, data: null };
        window.statusDetailModal = { show: false, statusData: null };
        window.showProfileModal = false;
        window.groupInspectModal = { show: false, room: null };
        window.groupInfoModal = { show: false, room: null };
        window.msgOptionsModal = { show: false, msg: null };

        window.aiGeneratingText = false;
        window.replyingMessage = null;
        
        // Medya Seçimleri İçin
        window.tempStatusFileUrl = null;
        window.tempStatusFileType = 'none';
        window.tempProfileFileUrl = null;

        // Ses Kaydı İçin Durumlar
        window.isRecording = false;
        window.mediaRecorder = null;
        window.audioChunks = [];
        window.recordingStartTime = 0;
        window.recordingInterval = null;
        window.recordingDurationStr = "00:00";

        window.formatText = function(text) {
            if(!text) return "";
            let html = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            html = html.replace(/!\[.*?\]\((.*?)\)/g, '<img src="$1" class="w-full max-w-[300px] rounded-xl my-2 shadow-md border border-slate-700">');
            html = html.replace(/(https?:\/\/[^\s]+(?:\.jpg|\.jpeg|\.png|\.gif|\.webp))/g, '<img src="$1" class="w-full max-w-[250px] rounded-xl my-2 shadow-md">');
            html = html.replace(/\*(.*?)\*/g, '<b class="text-white">$1</b>'); 
            html = html.replace(/_(.*?)_/g, '<i class="text-cyan-200">$1</i>'); 
            html = html.replace(/\n/g, '<br/>');
            return html;
        }

        window.showToast = function(msg, type = 'info') {
            let id = Date.now();
            window.activeToasts.push({ id, msg, type });
            window.renderToasts();
            setTimeout(() => {
                window.activeToasts = window.activeToasts.filter(t => t.id !== id);
                window.renderToasts();
            }, 3000);
        }

        window.renderToasts = function() {
            const container = document.getElementById('toast-container');
            if(!container) return;
            container.innerHTML = window.activeToasts.map(t => `
                <div class="bg-[#111622]/95 backdrop-blur-md border ${t.type === 'error' ? 'border-rose-500/50' : 'border-cyan-500/50'} text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-slide-in max-w-sm">
                    <i data-lucide="${t.type === 'error' ? 'alert-circle' : 'check-circle'}" class="w-5 h-5 ${t.type === 'error' ? 'text-rose-400' : 'text-cyan-400'}"></i>
                    <span class="text-xs font-medium leading-relaxed">${t.msg}</span>
                </div>
            `).join('');
            if(window.lucide) window.lucide.createIcons();
        }

        window.playSynthSound = function(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'sent') { osc.frequency.setValueAtTime(800, ctx.currentTime); gain.gain.setValueAtTime(0.08, ctx.currentTime); osc.start(); osc.stop(ctx.currentTime + 0.08); } 
                else if (type === 'received') { osc.frequency.setValueAtTime(600, ctx.currentTime); gain.gain.setValueAtTime(0.08, ctx.currentTime); osc.start(); osc.stop(ctx.currentTime + 0.12); }
            } catch (e) {}
        }

        window.generateAvatar = function(name, url) {
            if (url && url !== 'logo.jpg' && (url.startsWith('http') || url.startsWith('blob:') || url.startsWith('data:'))) return `<img src="${url}" onerror="this.src='logo.jpg'" class="w-full h-full object-cover">`;
            if (url === 'logo.jpg') return `<div class="w-full h-full bg-slate-900 flex items-center justify-center text-cyan-400 font-extrabold text-xl shadow-inner border border-cyan-500/30">S</div>`;
            let letter = name ? name.charAt(0).toUpperCase() : '?';
            return `<div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-cyan-600 to-blue-600 text-white font-bold text-lg shadow-inner">${letter}</div>`;
        }

        window.isContact = function(targetUid) {
            if (targetUid === window.user?.uid) return true;
            return window.db.rooms.some(r => r.type !== 'system' && r.type !== 'ai' && r.participants.includes(window.user?.uid) && r.participants.includes(targetUid));
        }
        
        window.togglePasswordVisibility = function(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if(input && icon) {
                if(input.type === 'password') {
                    input.type = 'text';
                    icon.setAttribute('data-lucide', 'eye-off');
                } else {
                    input.type = 'password';
                    icon.setAttribute('data-lucide', 'eye');
                }
                if(window.lucide) window.lucide.createIcons();
            }
        }

        window.changeAuthStep = function(step) { window.authStep = step; window.render(); }

        window.registerUser = async function() {
            const email = document.getElementById('regEmail').value.trim();
            const name = document.getElementById('regName').value.trim();
            const password = document.getElementById('regPass').value.trim();
            
            if(!email || !name || !password) return window.showToast('Lütfen tüm alanları doldurun.', 'error');
            if(window.db.users.find(u => u.email === email)) return window.showToast('Bu E-posta zaten kayıtlı!', 'error');
            if(window.db.users.find(u => u.displayName === name)) return window.showToast('Bu kullanıcı adı alınmış.', 'error');

            const newUid = 'usr_' + Date.now().toString(36) + Math.random().toString(36).substr(2);
            const userData = { uid: newUid, email: email, displayName: name, password: password, photoURL: '', about: 'Sohbetod kullanıyorum.' };

            try {
                if(dbFirestore) {
                    try { await setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'users', newUid), userData); } 
                    catch (fbErr) { console.warn("Bulut kaydı başarısız, yerel belleğe işleniyor", fbErr); window.db.users.push(userData); }
                } else { window.db.users.push(userData); }
                
                window.currentUserUid = newUid; window.user = userData;
                localStorage.setItem('sohbetod_current_uid', newUid);
                window.authStep = 'app';
                window.showToast('Kayıt başarılı! Sohbetod\'a hoş geldin.');
                window.render();
            } catch (error) { window.showToast('Kayıt sırasında bilinmeyen bir hata oluştu.', 'error'); }
        }

        window.loginUser = function() {
            const email = document.getElementById('logEmail').value.trim();
            const password = document.getElementById('logPass').value.trim();
            if(!email || !password) return window.showToast('Tüm bilgileri eksiksiz girin.', 'error');

            const foundUser = window.db.users.find(u => u.email === email && u.password === password);
            if(foundUser) {
                window.currentUserUid = foundUser.uid; window.user = foundUser;
                localStorage.setItem('sohbetod_current_uid', foundUser.uid);
                window.authStep = 'app';
                window.showToast('Başarıyla giriş yapıldı!'); window.render();
            } else { window.showToast('E-posta veya Şifre hatalı!', 'error'); }
        }

        window.logoutApp = function() {
            window.currentUserUid = null; window.user = null;
            localStorage.removeItem('sohbetod_current_uid');
            window.authStep = 'landing'; window.activeRoom = null;
            window.render();
        }

        window.triggerProfileFileInput = function() { document.getElementById('hiddenProfileFileInput').click(); }
        window.handleProfileFile = function(e) {
            const file = e.target.files[0];
            if(!file) return;
            if(file.size > 10 * 1024 * 1024) return window.showToast('Dosya çok büyük. Maksimum 10MB.', 'error');
            
            window.tempProfileFileUrl = URL.createObjectURL(file);
            document.getElementById('profPhotoPreview').innerHTML = window.generateAvatar(window.user.displayName, window.tempProfileFileUrl);
            window.showToast('Resim seçildi. Kaydetmeyi unutmayın.');
        }

        window.updateProfile = async function() {
            const newName = document.getElementById('profName').value.trim();
            const newAbout = document.getElementById('profAbout').value.trim();
            let finalPhotoUrl = window.user.photoURL;

            const linkInput = document.getElementById('profPhotoLink').value.trim();
            if (window.tempProfileFileUrl) finalPhotoUrl = window.tempProfileFileUrl; 
            else if (linkInput) finalPhotoUrl = linkInput;

            if(!newName) return window.showToast('İsim boş bırakılamaz.', 'error');
            
            window.user.displayName = newName;
            window.user.photoURL = finalPhotoUrl;
            window.user.about = newAbout;

            try {
                if(dbFirestore) await updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'users', window.user.uid), window.user);
                window.showToast('Profil başarıyla güncellendi.');
                window.showProfileModal = false;
                window.tempProfileFileUrl = null; 
                window.render();
            } catch(e) { window.showToast('Hata oluştu.', 'error'); }
        }

        window.switchTab = function(tab) { window.activeTab = tab; if(window.innerWidth < 768) window.activeRoom = null; window.render(); }
        window.selectRoom = function(roomId) { window.activeRoom = window.db.rooms.find(r => r.id === roomId); window.render(); setTimeout(() => window.scrollToBottom(), 100); }
        window.closeRoom = function() { window.activeRoom = null; window.render(); }
        window.scrollToBottom = function() { const end = document.getElementById('messagesEnd'); if (end) end.scrollIntoView({ behavior: 'smooth' }); }

        window.openMsgOptions = function(msgId) { window.msgOptionsModal = { show: true, msg: window.db.messages.find(m => m.id === msgId) }; window.render(); }
        window.closeMsgOptions = function() { window.msgOptionsModal = { show: false, msg: null }; window.render(); }

        window.deleteMsgForMe = async function() {
            let msg = window.msgOptionsModal.msg;
            if(!msg) return;
            if(!msg.deletedFor) msg.deletedFor = [];
            if(!msg.deletedFor.includes(window.user.uid)) msg.deletedFor.push(window.user.uid);
            try { if(dbFirestore) await updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'messages', msg.id), { deletedFor: msg.deletedFor }); window.showToast('Mesaj senden silindi.'); } catch(e) {}
            window.closeMsgOptions(); window.render();
        }

        window.deleteMsgForEveryone = async function() {
            let msg = window.msgOptionsModal.msg;
            if(!msg || msg.senderId !== window.user.uid) return;
            msg.isDeleted = true;
            try { if(dbFirestore) await updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'messages', msg.id), { isDeleted: true }); window.showToast('Mesaj herkesten silindi.'); } catch(e) {}
            window.closeMsgOptions(); window.render();
        }

        window.addReaction = async function(emoji) {
            let msg = window.msgOptionsModal.msg;
            if(!msg) return;
            if(!msg.reactions) msg.reactions = {};
            if(!msg.reactions[emoji]) msg.reactions[emoji] = [];
            
            if(msg.reactions[emoji].includes(window.user.uid)) {
                msg.reactions[emoji] = msg.reactions[emoji].filter(id => id !== window.user.uid);
                if(msg.reactions[emoji].length === 0) delete msg.reactions[emoji];
            } else { msg.reactions[emoji].push(window.user.uid); }

            try { if(dbFirestore) await updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'messages', msg.id), { reactions: msg.reactions }); window.playSynthSound('sent'); } catch(e) {}
            window.closeMsgOptions(); window.render();
        }

        window.triggerChatFileInput = function() { document.getElementById('chatFileInput').click(); }
        
        window.handleChatFileSelect = async function(e) {
            const file = e.target.files[0];
            if(!file) return;
            if(file.size > 20 * 1024 * 1024) return window.showToast('Dosya boyutu çok büyük (Max: 20MB)', 'error');

            const fileUrl = URL.createObjectURL(file);
            let type = 'file';
            if(file.type.startsWith('image/')) type = 'image';
            else if(file.type.startsWith('video/')) type = 'video';
            else if(file.type.startsWith('audio/')) type = 'audio';

            window.sendMediaMessage(fileUrl, type, file.name);
            e.target.value = ''; // Reset input
        }

        window.toggleRecording = async function() {
            if(window.isRecording) {
                // Stop recording
                if(window.mediaRecorder && window.mediaRecorder.state !== 'inactive') {
                    window.mediaRecorder.stop();
                }
                window.isRecording = false;
                clearInterval(window.recordingInterval);
                window.render();
            } else {
                // Start recording
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    window.mediaRecorder = new MediaRecorder(stream);
                    window.audioChunks = [];
                    
                    window.mediaRecorder.ondataavailable = e => { if(e.data.size > 0) window.audioChunks.push(e.data); };
                    window.mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(window.audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        window.sendMediaMessage(audioUrl, 'audio', 'Sesli Mesaj');
                        stream.getTracks().forEach(track => track.stop());
                    };
                    
                    window.mediaRecorder.start();
                    window.isRecording = true;
                    window.recordingStartTime = Date.now();
                    window.recordingDurationStr = "00:00";
                    
                    window.recordingInterval = setInterval(() => {
                        const diff = Math.floor((Date.now() - window.recordingStartTime) / 1000);
                        const mins = String(Math.floor(diff / 60)).padStart(2, '0');
                        const secs = String(diff % 60).padStart(2, '0');
                        window.recordingDurationStr = `${mins}:${secs}`;
                        const recText = document.getElementById('recordingTimerText');
                        if(recText) recText.innerText = window.recordingDurationStr;
                    }, 1000);
                    
                    window.render();
                } catch(err) {
                    window.showToast("Mikrofon izni alınamadı.", "error");
                    console.error("Mic error:", err);
                }
            }
        }

        window.sendMediaMessage = async function(url, type, fileName) {
            const msgId = 'msg_' + Date.now();
            const newMsg = {
                id: msgId, roomId: window.activeRoom.id, senderId: window.user.uid, senderName: window.user.displayName,
                text: fileName || (type === 'audio' ? 'Sesli Mesaj' : 'Medya'), 
                mediaUrl: url, 
                timestamp: new Date().toISOString(), type: type, isDeleted: false, deletedFor: [], reactions: {}
            };

            try {
                if(dbFirestore) await setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'messages', msgId), newMsg);
                else window.db.messages.push(newMsg);
                window.playSynthSound('sent'); 
                window.render();
                setTimeout(() => window.scrollToBottom(), 100);
            } catch (err) { window.showToast("Dosya gönderilemedi.", "error"); }
        }

        window.handleChatSubmit = async function(e) {
            e.preventDefault();
            const input = document.getElementById('msgTextInput');
            if(!input) return;
            let text = input.value.trim();
            if(!text) return;
            
            input.value = '';
            const msgId = 'msg_' + Date.now();
            const newMsg = {
                id: msgId, roomId: window.activeRoom.id, senderId: window.user.uid, senderName: window.user.displayName,
                text: text, timestamp: new Date().toISOString(), type: 'text', isDeleted: false, deletedFor: [], reactions: {}
            };

            if(window.replyingMessage) {
                newMsg.replyToSender = window.replyingMessage.senderName;
                newMsg.replyToText = window.replyingMessage.text;
                window.replyingMessage = null;
            }

            try {
                if(window.activeRoom.id === 'sys_feedback') {
                    const feedbackData = { id: msgId, senderId: window.user.uid, senderEmail: window.user.email, senderName: window.user.displayName, text: text, status: 'İletiliyor...', timestamp: new Date().toISOString() };
                    if(dbFirestore) await setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'feedbacks', msgId), feedbackData);
                    else window.db.feedbacks.push(feedbackData);
                    window.playSynthSound('sent'); window.render();
                    
                    setTimeout(async () => {
                        feedbackData.status = 'yunusizzeddinguder@gmail.com adresine yönlendirildi';
                        if(dbFirestore) await updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'feedbacks', msgId), { status: feedbackData.status });
                        window.render();
                    }, 2000);
                } else {
                    if(dbFirestore) await setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'messages', msgId), newMsg);
                    else window.db.messages.push(newMsg);
                    window.playSynthSound('sent'); window.render(); setTimeout(() => window.scrollToBottom(), 100);

                    // Sohbetod AI Mantığı
                    if(window.activeRoom.id === 'sys_ai') {
                        window.aiGeneratingText = true; window.render(); setTimeout(() => window.scrollToBottom(), 100);
                        
                        try {
                            let wantsImage = text.match(/(resim|fotoğraf|çizim|görsel) (çiz|üret|yap|oluştur|bana|göster)/i);
                            let aiText = "";

                            if(wantsImage) {
                                let prompt = text.replace(/(resim|fotoğraf|çizim|görsel|çiz|üret|yap|oluştur|bana|göster)/gi, "").trim() || "modern chat concept art";
                                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true`;
                                aiText = `İşte istediğin görsel:\n\n![${prompt}](${imageUrl})\n\n_Umarım beğenirsin!_`;
                            } else {
                                const apiKey = ""; 
                                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                                
                                const roomMessages = window.db.messages.filter(m => m.roomId === 'sys_ai' && !m.isDeleted && !m.deletedFor?.includes('sys_ai')).slice(-10);
                                let aiContext = "Sohbet Geçmişi:\n";
                                roomMessages.forEach(m => { aiContext += `${m.senderName}: ${m.text}\n`; });
                                
                                const systemInstructionText = `SENİN KİMLİĞİN VE ROLÜN:
Sen "Sohbetod AI"sın. Sohbetod adlı modern ve kullanıcı dostu mesajlaşma platformunun resmi yapay zeka asistanısın.
EN ÖNEMLİ KURAL - YARATICIN:
Seni kimin oluşturduğuna dair sorular geldiğinde ŞU CEVABI VERMELİSİN:
"Ben Sohbetod AI'yım. Sohbetod platformu, genç geliştirici Yunus İzzeddin Güder tarafından tasarlandı ve geliştirildi."
Formatlama için Markdown kullan. Resim istenirse "Bana '... resmi çiz' dersen çizebilirim" de.`;

                                const payload = { contents: [{ parts: [{ text: aiContext + "\n\nKullanıcının yeni mesajı: " + text }] }], systemInstruction: { parts: [{ text: systemInstructionText }] } };
                                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                                aiText = "Sistemsel bir yoğunluk var, lütfen birazdan tekrar dene.";
                                if (response.ok) {
                                    const result = await response.json();

        window.handleStatusFile = function(e) {
            const file = e.target.files[0];
            if(!file) return;
            if(file.size > 20 * 1024 * 1024) return window.showToast('Dosya boyutu çok büyük (Max: 20MB)', 'error');

            window.tempStatusFileUrl = URL.createObjectURL(file);
            if(file.type.startsWith('image/')) window.tempStatusFileType = 'image';
            else if(file.type.startsWith('video/')) window.tempStatusFileType = 'video';
            else if(file.type.startsWith('audio/')) window.tempStatusFileType = 'audio';
            else window.tempStatusFileType = 'document';

            document.getElementById('statusFileNameDisplay').innerHTML = `Seçilen dosya: <span class="text-cyan-400">${file.name}</span>`;
            window.showToast('Medya başarıyla eklendi.');
        }
        
        window.submitStatus = async function() {
            const text = document.getElementById('statusTextInput').value.trim();
            const linkUrl = document.getElementById('statusMediaLinkInput').value.trim();
            
            let finalMediaUrl = '';
            let finalMediaType = 'none';

            if (window.tempStatusFileUrl) {
                finalMediaUrl = window.tempStatusFileUrl;
                finalMediaType = window.tempStatusFileType;
            } else if (linkUrl) {
                finalMediaUrl = linkUrl;
                if(linkUrl.match(/\.(jpeg|jpg|gif|png|webp)/i)) finalMediaType = 'image';
                else if(linkUrl.match(/\.(mp4|webm|ogg)/i)) finalMediaType = 'video';
                else if(linkUrl.match(/\.(mp3|wav)/i)) finalMediaType = 'audio';
                else finalMediaType = 'link'; 
            }
            
            if(!text && !finalMediaUrl) return window.showToast('Metin veya medya eklemelisiniz.', 'error');

            const statusId = 'st_' + Date.now();
            const statusData = { 
                id: statusId, userId: window.user.uid, userName: window.user.displayName, userAvatar: window.user.photoURL, 
                content: text, mediaType: finalMediaType, mediaUrl: finalMediaUrl, timestamp: new Date().toISOString(), viewers: [], likes: [] 
            };

            if(dbFirestore) await setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'statusUpdates', statusId), statusData);
            else window.db.statusUpdates.push(statusData);
            
            window.showToast('Durumunuz paylaşıldı!');
            window.showStatusModal = false;
            window.tempStatusFileUrl = null;
            window.render();
        }

            if(targetUserId !== window.user.uid) {

                        if(dbFirestore) await updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'statusUpdates', upd.id), { viewers: upd.viewers });

        window.initApp = async function() {
            let isRendered = false;
            const safeBoot = () => { if(!isRendered) { window.render(); isRendered = true; } };
            setTimeout(safeBoot, 2000);

            if(auth) {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                    else await signInAnonymously(auth);
                    
                    if(window.currentUserUid && dbFirestore) {
                        try {
                            const uSnap = await getDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'users', window.currentUserUid));
                            if(uSnap.exists()) { window.user = uSnap.data(); window.authStep = 'app'; } 
                            else window.logoutApp();
                        } catch(e) { console.warn("Kullanıcı verisi hatası:", e); }
                    }

                    const collections = ['users', 'rooms', 'messages', 'statusUpdates', 'notifications', 'feedbacks'];
                    collections.forEach(colName => {
                        onSnapshot(collection(dbFirestore, 'artifacts', appId, 'public', 'data', colName), (snapshot) => {
                            window.db[colName] = snapshot.docs.map(doc => doc.data());
                            
                            if (colName === 'users' && window.currentUserUid) {
                                window.user = window.db.users.find(u => u.uid === window.currentUserUid);
                                if (!window.user && window.authStep === 'app') window.logoutApp();
                            }
                            if(colName === 'rooms') {
                                if(!window.db.rooms.find(r=>r.id === 'sys_ai')) window.db.rooms.push({ id: 'sys_ai', name: 'Sohbetod AI Asistanı', type: 'ai', photoURL: 'logo.jpg', about: 'Sohbetod Resmi Yapay Zekası', participants: ['system'], creator: 'system', admins:[] });
                                if(!window.db.rooms.find(r=>r.id === 'sys_feedback')) window.db.rooms.push({ id: 'sys_feedback', name: 'Şikayet ve Öneriler', type: 'system', photoURL: 'logo.jpg', about: 'Yönetime Ulaşın', participants: ['system'], creator: 'system', admins:[] });
                            }
                            if (isRendered) window.render(); 
                        }, (error) => { console.error(`Sync hatası ${colName}:`, error); });
                    });
                    safeBoot(); 
                } catch (e) { console.error("Firebase auth hatası:", e); safeBoot(); }
            } else {
                if(window.currentUserUid) {
                    window.user = window.db.users.find(u => u.uid === window.currentUserUid);
                    if(window.user) window.authStep = 'app';
                }
                safeBoot();
            }
        }

        window.toggleRecording = async function() {
            if(window.isRecording) {
                // Stop recording
                if(window.mediaRecorder && window.mediaRecorder.state !== 'inactive') {
                    window.mediaRecorder.stop();
                }
                window.isRecording = false;
                clearInterval(window.recordingInterval);
                window.render();
            } else {
                // Start recording
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    window.mediaRecorder = new MediaRecorder(stream);
                    window.audioChunks = [];
                    
                    window.mediaRecorder.ondataavailable = e => { if(e.data.size > 0) window.audioChunks.push(e.data); };
                    window.mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(window.audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        window.sendMediaMessage(audioUrl, 'audio', 'Sesli Mesaj');
                        stream.getTracks().forEach(track => track.stop());
                    };
                    
                    window.mediaRecorder.start();
                    window.isRecording = true;
                    window.recordingStartTime = Date.now();
                    window.recordingDurationStr = "00:00";
                    
                    window.recordingInterval = setInterval(() => {
                        const diff = Math.floor((Date.now() - window.recordingStartTime) / 1000);
                        const mins = String(Math.floor(diff / 60)).padStart(2, '0');
                        const secs = String(diff % 60).padStart(2, '0');
                        window.recordingDurationStr = `${mins}:${secs}`;
                        const recText = document.getElementById('recordingTimerText');
                        if(recText) recText.innerText = window.recordingDurationStr;
                    }, 1000);
                    
                    window.render();
                } catch(err) {
                    window.showToast("Mikrofon izni alınamadı.", "error");
                    console.error("Mic error:", err);
                }
            }
        }

            const updates = window.db.statusUpdates.filter(s => s.userId === targetUserId);
            if(updates.length === 0) return;
            
            if(targetUserId !== window.user.uid) {
                updates.forEach(async upd => {
                    if(!upd.viewers.includes(window.user.uid)) {
                        upd.viewers.push(window.user.uid);
                        if(dbFirestore) await updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'statusUpdates', upd.id), { viewers: upd.viewers });
                    }
                });
            }
            window.statusViewModal = { show: true, data: updates };
            window.render();
        }
        window.closeStatusView = function() { window.statusViewModal = { show: false, data: null }; window.render(); }

        window.likeStatus = async function(statusId) {
            let upd = window.db.statusUpdates.find(s => s.id === statusId);
            if(!upd) return;
            let hasLiked = upd.likes.includes(window.user.uid);
            if(hasLiked) upd.likes = upd.likes.filter(id => id !== window.user.uid);
            else { upd.likes.push(window.user.uid); window.playSynthSound('sent'); }
            
            if(dbFirestore) await updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'statusUpdates', statusId), { likes: upd.likes });
            window.render();
        }
        
        window.viewStatusStats = function(statusId) {
            let upd = window.db.statusUpdates.find(s => s.id === statusId);
            if(!upd) return;
            window.statusDetailModal = { show: true, statusData: upd };
            window.render();
        }
        window.closeStatusStats = function() { window.statusDetailModal = { show: false, statusData: null }; window.render(); }

        window.initApp = async function() {
            let isRendered = false;
            const safeBoot = () => { if(!isRendered) { window.render(); isRendered = true; } };
            setTimeout(safeBoot, 2000);

            if(auth) {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                    else await signInAnonymously(auth);
                    
                    if(window.currentUserUid && dbFirestore) {
                        try {
                            const uSnap = await getDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'users', window.currentUserUid));
                            if(uSnap.exists()) { window.user = uSnap.data(); window.authStep = 'app'; } 
                            else window.logoutApp();
                        } catch(e) { console.warn("Kullanıcı verisi hatası:", e); }
                    }

                    const collections = ['users', 'rooms', 'messages', 'statusUpdates', 'notifications', 'feedbacks'];
                    collections.forEach(colName => {
                        onSnapshot(collection(dbFirestore, 'artifacts', appId, 'public', 'data', colName), (snapshot) => {
                            window.db[colName] = snapshot.docs.map(doc => doc.data());
                            
                            if (colName === 'users' && window.currentUserUid) {
                                window.user = window.db.users.find(u => u.uid === window.currentUserUid);
                                if (!window.user && window.authStep === 'app') window.logoutApp();
                            }
                            if(colName === 'rooms') {
                                if(!window.db.rooms.find(r=>r.id === 'sys_ai')) window.db.rooms.push({ id: 'sys_ai', name: 'Sohbetod AI Asistanı', type: 'ai', photoURL: 'logo.jpg', about: 'Sohbetod Resmi Yapay Zekası', participants: ['system'], creator: 'system', admins:[] });
                                if(!window.db.rooms.find(r=>r.id === 'sys_feedback')) window.db.rooms.push({ id: 'sys_feedback', name: 'Şikayet ve Öneriler', type: 'system', photoURL: 'logo.jpg', about: 'Yönetime Ulaşın', participants: ['system'], creator: 'system', admins:[] });
                            }
                            if (isRendered) window.render(); 
                        }, (error) => { console.error(`Sync hatası ${colName}:`, error); });
                    });
                    safeBoot(); 
                } catch (e) { console.error("Firebase auth hatası:", e); safeBoot(); }
            } else {
                if(window.currentUserUid) {
                    window.user = window.db.users.find(u => u.uid === window.currentUserUid);
                    if(window.user) window.authStep = 'app';
                }
                safeBoot();
            }
        }

        setTimeout(() => { window.initApp(); }, 200);

        window.render = function() {
            const appDiv = document.getElementById('app');

            if (window.authStep === 'landing') {
                appDiv.innerHTML = `
                    <div class="flex flex-col items-center justify-center w-full h-full bg-gradient-to-tr from-[#0a0715] via-[#05070a] to-[#0c1820] relative p-4 animate-fade-in">
                        <div class="p-8 text-center glass-panel rounded-3xl border border-white/5 max-w-md w-full relative z-10 shadow-[0_10px_40px_rgba(0,0,0,0.5)]">
                            <div class="w-28 h-28 mx-auto mb-6 rounded-3xl border-2 border-cyan-500/50 shadow-[0_0_30px_rgba(6,182,212,0.3)] bg-[#0c0f16] flex items-center justify-center overflow-hidden">
                                <img src="logo.jpg" onerror="this.outerHTML='<i data-lucide=\\'message-square\\' class=\\'w-12 h-12 text-cyan-400\\'></i>'" class="w-full h-full object-cover">
                            </div>
                            <h1 class="text-5xl font-extrabold bg-gradient-to-r from-cyan-400 via-blue-400 to-purple-400 bg-clip-text text-transparent mb-3 tracking-tight">Sohbetod</h1>
                            <p class="text-cyan-100/70 mb-8 text-sm font-medium px-4">Şifreli gruplar, medya paylaşımları, sesli mesajlar ve yeni nesil AI asistanı.</p>
                            <div class="space-y-3">
                                <button onclick="changeAuthStep('login')" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.3)] transition-all cursor-pointer">Giriş Yap</button>
                                <button onclick="changeAuthStep('register')" class="w-full bg-transparent border border-cyan-500/30 hover:bg-cyan-500/10 text-cyan-400 font-bold py-3.5 px-6 rounded-xl transition-all cursor-pointer">Yeni Hesap Oluştur</button>
                            </div>
                        </div>
                    </div>
                `;
                if(window.lucide) window.lucide.createIcons(); return;
            }

            if (window.authStep === 'register' || window.authStep === 'login') {
                const isReg = window.authStep === 'register';
                appDiv.innerHTML = `
                    <div class="flex flex-col items-center justify-center w-full h-full bg-gradient-to-br from-[#05070a] to-[#0a0715] p-4 animate-fade-in">
                        <div class="w-full max-w-md p-8 bg-[#0c0f16] border border-slate-800 shadow-2xl rounded-3xl text-center relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r ${isReg ? 'from-purple-500 to-pink-500' : 'from-cyan-500 to-blue-500'}"></div>
                            <h2 class="text-2xl font-bold text-gray-100 mt-2">${isReg ? 'Yeni Hesap Oluştur' : 'Hesaba Giriş Yap'}</h2>
                            <p class="text-xs text-gray-500 mt-2 mb-6">${isReg ? 'Bilgilerinizi girerek kayıt olun.' : 'Lütfen kayıtlı bilgilerinizi girin.'}</p>
                            <div class="space-y-4 text-left">
                                <div>
                                    <label class="block text-[10px] font-bold text-cyan-400 mb-1.5 uppercase">E-posta</label>
                                    <input type="email" id="${isReg?'reg':'log'}Email" placeholder="ornek@gmail.com" class="w-full px-4 py-3 border border-slate-800 bg-[#06080d] rounded-xl text-sm text-gray-100 focus:outline-none focus:border-cyan-500 transition-colors">
                                </div>
                                ${isReg ? `
                                <div>

                                    <input type="text" id="regName" placeholder="Adınız..." class="w-full px-4 py-3 border border-slate-800 bg-[#06080d] rounded-xl text-sm text-gray-100 focus:outline-none focus:border-cyan-500 transition-colors">

                                    <label class="block text-[10px] font-bold text-cyan-400 mb-1.5 uppercase">Şifre</label>

                                    <button type="button" onclick="togglePasswordVisibility('${isReg?'reg':'log'}Pass', 'eye-${isReg?'reg':'log'}')" class="absolute right-3 bottom-3 text-gray-500 hover:text-cyan-400 cursor-pointer">
                                        <i data-lucide="eye" id="eye-${isReg?'reg':'log'}" class="w-4 h-4"></i>
                                    </button>
                                </div>
                                <div class="flex justify-between items-center pt-4">
                                    <button onclick="changeAuthStep('landing')" class="text-gray-400 hover:text-white text-xs font-semibold cursor-pointer transition-colors">Geri Dön</button>
                                    <button onclick="${isReg?'registerUser()':'loginUser()'}" class="bg-gradient-to-r ${isReg?'from-purple-600 to-pink-600':'from-cyan-600 to-blue-600'} text-white font-bold py-3 px-8 rounded-xl text-sm cursor-pointer shadow-lg hover:opacity-90 transition-all">${isReg?'Kayıt Ol':'Giriş Yap'}</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                if(window.lucide) window.lucide.createIcons();
                return;
            }

            let sidebarHidden = window.activeRoom ? 'hidden md:flex' : 'flex';
            let chatHidden = window.activeRoom ? 'flex' : 'hidden md:flex';

            userRooms.sort((a,b) => {
                let msgA = window.db.messages.filter(m => m.roomId === a.id && !m.deletedFor?.includes(window.user.uid)).pop();

                let timeA = msgA ? new Date(msgA.timestamp).getTime() : 0;
                let timeB = msgB ? new Date(msgB.timestamp).getTime() : 0;
                return timeB - timeA;

            let roomListHTML = userRooms.length === 0 ? '<p class="text-xs text-gray-500 p-4 text-center">Sohbetiniz yok. Keşfetten bulabilirsiniz.</p>' : userRooms.map(room => {

                let lastMsgText = '';
                if(lastMsg) {
                    if(room.id === 'sys_feedback') lastMsgText = `Durum: ${lastMsg.status}`;
                    else {
                        let prefix = lastMsg.senderId === window.user.uid ? 'Sen: ' : '';
                        if(lastMsg.type === 'image') lastMsgText = prefix + '📷 Fotoğraf';
                        else if(lastMsg.type === 'video') lastMsgText = prefix + '🎥 Video';
                        else if(lastMsg.type === 'audio') lastMsgText = prefix + '🎵 Sesli Mesaj';
                        else if(lastMsg.type === 'file') lastMsgText = prefix + '📄 Dosya';
                        else lastMsgText = prefix + lastMsg.text;
                    }
                }

                let displayName = room.name; let pUrl = room.photoURL;
                if(room.type === 'private' && room.participants) {
                    let otherUser = window.db.users.find(u => u.uid === room.participants.find(x => x !== window.user.uid));

                return `
                    <div onclick="selectRoom('${room.id}')" class="flex items-center gap-3 p-4 cursor-pointer hover:bg-slate-800/40 transition-all ${activeClass}">
                        <div class="relative w-12 h-12 rounded-full flex items-center justify-center border border-slate-700 overflow-hidden shrink-0">${window.generateAvatar(displayName, pUrl)}</div>

                            <p class="text-xs text-gray-400 truncate ${room.id === 'sys_feedback' && lastMsg ? 'text-amber-400' : ''}">${lastMsgText}</p>
                        </div>
                    </div>
                `;
            }).join('');

            let searchHTML = `
                <div class="p-4 space-y-4">
                    <div class="flex gap-2 mb-4 bg-slate-900/50 p-1 rounded-xl border border-slate-800">
                        <button onclick="changeSearchType('user')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-colors ${window.searchType === 'user' ? 'bg-slate-800 text-white' : 'text-gray-500'}">Kişiler</button>
                        <button onclick="changeSearchType('group')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-colors ${window.searchType === 'group' ? 'bg-slate-800 text-white' : 'text-gray-500'}">Gruplar</button>
                    </div>
                    <input type="text" value="${window.chatSearchQuery}" onkeyup="updateSearchQuery(this.value)" placeholder="Arama yapın..." class="w-full bg-[#111622] text-sm px-4 py-2.5 rounded-xl border border-slate-700 outline-none text-white focus:border-cyan-500 transition-colors">
                    <div class="pt-2 space-y-2">
                        ${window.chatSearchQuery.trim() !== '' ? window.db[window.searchType === 'user' ? 'users' : 'rooms'].filter(x => (window.searchType === 'user' ? x.email : x.name).toLowerCase().includes(window.chatSearchQuery.toLowerCase()) && x.uid !== window.user.uid && x.type !== 'private').map(res => `
                            <div class="bg-slate-800/40 p-3 rounded-xl border border-slate-700 flex justify-between items-center">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full border border-slate-600 overflow-hidden shrink-0">${window.generateAvatar(res.displayName || res.name, res.photoURL)}</div>
                                    <div class="truncate max-w-[150px]"><div class="text-sm text-white font-bold truncate">${res.displayName || res.name}</div><div class="text-[10px] text-gray-400 truncate">${res.about || ''}</div></div>

                                <button onclick="${window.searchType==='user' ? `startChatWithUser('${res.uid}')` : `openGroupInspect('${res.id}')`}" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer shrink-0">${window.searchType==='user' ? 'Sohbet' : (res.participants.includes(window.user.uid) ? 'Aç' : 'İncele')}</button>
                            </div>
                        `).join('') || '<div class="text-center text-xs text-gray-500">Bulunamadı.</div>' : '<div class="text-center text-xs text-gray-600">Aramak için yazmaya başlayın.</div>'}
                    </div>
                </div>
            `;

            let statusGroups = {};
            window.db.statusUpdates.filter(st => st.userId === window.user.uid || window.isContact(st.userId)).forEach(st => {
                if(!statusGroups[st.userId]) statusGroups[st.userId] = { userId: st.userId, userName: st.userName, userAvatar: st.userAvatar, updates: [] };
                statusGroups[st.userId].updates.push(st);

            let statusHTML = `
                <div class="p-4 space-y-4">

                        <div onclick="openStatusModal(true)" class="relative w-14 h-14 rounded-full bg-slate-800 flex items-center justify-center cursor-pointer border-2 border-slate-700 overflow-hidden hover:border-cyan-500 shrink-0">

                            <div class="absolute -bottom-0.5 -right-0.5 p-1 bg-cyan-500 rounded-full text-slate-950"><i data-lucide="plus" class="w-3 h-3"></i></div>

                if(msg.type === 'image') mediaContent = `<img src="${msg.mediaUrl}" class="max-w-[200px] sm:max-w-[280px] rounded-lg mb-1 shadow-sm cursor-pointer" onclick="window.open('${msg.mediaUrl}', '_blank')"><div class="text-[11px] text-gray-400">${msg.text !== 'Medya' ? msg.text : ''}</div>`;

                else if(msg.type === 'file') mediaContent = `<a href="${msg.mediaUrl}" download="${msg.text}" target="_blank" class="flex items-center gap-3 bg-black/30 hover:bg-black/50 p-3 rounded-lg transition-colors border border-slate-700/50"><i data-lucide="file-text" class="w-6 h-6 text-cyan-400"></i><div class="flex-1 min-w-0"><p class="text-xs font-bold text-gray-200 truncate">${msg.text}</p><p class="text-[9px] text-gray-500">Dosyayı İndir</p></div></a>`;

                        </div>
                    </div>
                `;
            }).join('');

            appDiv.innerHTML = `
                <div class="flex h-full w-full bg-[#0a0d14]">

                                <div><input type="text" id="statusMediaLinkInput" placeholder="Medya Linki (https://...jpg/mp4)" class="w-full px-4 py-3 bg-[#111622] rounded-xl text-sm border border-slate-700 outline-none text-white focus:border-cyan-500"></div>
                                <div><textarea id="statusTextInput" placeholder="Durum açıklaması ekle..." class="w-full px-4 py-3 bg-[#111622] rounded-xl text-sm border border-slate-700 outline-none text-white h-20 resize-none focus:border-cyan-500"></textarea></div>
                                <button onclick="submitStatus()" class="w-full py-3.5 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold rounded-xl text-sm shadow-lg hover:opacity-90 transition-opacity">Durumumu Paylaş</button>
                            </div>
                        </div>
                    </div>` : ''}
                    
                ${window.statusViewModal.show && window.statusViewModal.data ? `
                    <div class="fixed inset-0 z-[90] bg-black flex items-center justify-center p-4 sm:p-8 animate-fade-in">
                        <button onclick="closeStatusView()" class="absolute top-4 right-4 p-2 bg-slate-800/80 rounded-full text-white z-20 hover:bg-slate-700"><i data-lucide="x" class="w-6 h-6"></i></button>
                        <div class="w-full max-w-md h-full max-h-[85vh] bg-slate-900 relative rounded-2xl overflow-hidden flex flex-col shadow-[0_0_50px_rgba(0,0,0,0.8)] border border-slate-700">
                            <div class="absolute top-0 w-full p-4 bg-gradient-to-b from-black/90 to-transparent flex items-center gap-3 z-20">
                                <div class="w-10 h-10 rounded-full border border-white/30 overflow-hidden shadow-lg shrink-0">${window.generateAvatar(window.statusViewModal.data[0].userName, window.statusViewModal.data[0].userAvatar)}</div>
                                <div class="flex-1"><div class="font-bold text-white text-sm drop-shadow-md">${window.statusViewModal.data[0].userName}</div><div class="text-[10px] text-gray-300 drop-shadow-md">${new Date(window.statusViewModal.data[0].timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div></div>
                            </div>
                            
                            <div class="flex-1 flex flex-col items-center justify-center bg-gradient-to-br from-[#0a0715] to-[#111622] relative overflow-hidden">
                                ${window.statusViewModal.data[0].mediaType === 'image' ? `<img src="${window.statusViewModal.data[0].mediaUrl}" class="w-full h-full object-contain">` : 
                                  window.statusViewModal.data[0].mediaType === 'video' ? `<video src="${window.statusViewModal.data[0].mediaUrl}" class="w-full h-full object-contain" autoplay controls></video>` : 
                                  window.statusViewModal.data[0].mediaType === 'audio' ? `<div class="p-8 text-center"><div class="w-24 h-24 bg-cyan-900/30 rounded-full flex items-center justify-center mx-auto mb-6 animate-pulse-soft"><i data-lucide="music" class="w-12 h-12 text-cyan-400"></i></div><audio src="${window.statusViewModal.data[0].mediaUrl}" controls class="w-full"></audio></div>` : ''}
                                ${window.statusViewModal.data[0].content ? `<div class="absolute bottom-20 w-full p-4 text-center z-10"><p class="text-white text-lg font-medium drop-shadow-lg bg-black/50 inline-block px-4 py-2 rounded-xl backdrop-blur-sm">${window.formatText(window.statusViewModal.data[0].content)}</p></div>` : ''}
                            </div>
                            
                            <div class="p-4 flex justify-between items-center absolute bottom-0 w-full bg-gradient-to-t from-black/90 to-transparent z-20">
                                ${window.statusViewModal.data[0].userId === window.user.uid ? `
                                    <button onclick="viewStatusStats('${window.statusViewModal.data[0].id}')" class="flex flex-col items-center gap-1 text-white opacity-80 hover:opacity-100 p-2">
                                        <i data-lucide="eye" class="w-5 h-5"></i><span class="text-[10px] font-bold">${window.statusViewModal.data[0].viewers.length}</span>
                                    </button>
                                ` : '<div></div>'}
                                
                                <div class="flex flex-col items-center gap-1">
                                    <button onclick="likeStatus('${window.statusViewModal.data[0].id}')" class="bg-black/40 p-3 rounded-full border border-white/20 hover:bg-rose-500/20 cursor-pointer group transition-colors shadow-lg">
                                        <i data-lucide="heart" class="w-6 h-6 ${window.statusViewModal.data[0].likes.includes(window.user.uid) ? 'text-rose-500 fill-rose-500' : 'text-white'} group-hover:scale-110 transition-transform"></i>
                                    </button>
                                    <span class="text-white text-[10px] font-bold drop-shadow-md">${window.statusViewModal.data[0].likes.length} Beğeni</span>
                                </div>
                            </div>
                        </div>
                    </div>` : ''}

                ${window.statusDetailModal.show && window.statusDetailModal.statusData ? `
                    <div class="fixed inset-0 z-[110] bg-black/60 flex items-end sm:items-center justify-center sm:p-4 animate-fade-in" onclick="closeStatusStats()">
                        <div class="w-full sm:max-w-sm bg-[#0c0f16] rounded-t-3xl sm:rounded-3xl border-t sm:border border-slate-700 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] p-5 animate-slide-up" onclick="event.stopPropagation()">
                            <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-sm text-white">Görüntüleme & Beğeniler</h3><button onclick="closeStatusStats()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button></div>
                            <div class="max-h-[50vh] overflow-y-auto custom-scrollbar space-y-2">
                                ${window.statusDetailModal.statusData.viewers.length === 0 ? '<p class="text-xs text-gray-500 text-center py-4">Henüz kimse görmedi.</p>' : ''}
                           ${window.statusDetailModal.statusData.viewers.map(uid => {
                                    let vUser = window.db.users.find(u=>u.uid === uid);
                                    let hasLiked = window.statusDetailModal.statusData.likes.includes(uid);
                                    if(!vUser) return '';
                                    return `
                                    <div class="flex items-center justify-between p-2 rounded-xl bg-slate-800/40 border border-slate-800">
                                        <div class="flex items-center gap-2">
                                            <div class="w-8 h-8 rounded-full overflow-hidden">${window.generateAvatar(vUser.displayName, vUser.photoURL)}</div>
                                            <span class="text-xs text-white font-bold">${vUser.displayName}</span>
                                        </div>
                                        ${hasLiked ? '<i data-lucide="heart" class="w-4 h-4 text-rose-500 fill-rose-500"></i>' : ''}
                                    </div>`
                                }).join('')}
                            </div>
                        </div>
                    </div>
                ` : ''}
            `;
            if(window.lucide) window.lucide.createIcons();
            
            if(window.activeRoom) setTimeout(window.scrollToBottom, 50);
        };
    </script>
</body>
</html>
