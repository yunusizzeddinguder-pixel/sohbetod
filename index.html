<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sohbetod Web Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes pulseSoft { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-slide-in { animation: slideIn 0.2s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        .animate-pop { animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-pulse-soft { animation: pulseSoft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        .typing-dot { animation: typing 1.4s infinite ease-in-out; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        .glass-panel { background: rgba(12, 15, 22, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

        /* Aydınlık Mod (Light Mode) Ayarları */
        body.light-mode { background: #f0f2f5 !important; color: #111 !important; }
        body.light-mode .bg-\[\#0a0d14\], body.light-mode .bg-\[\#0c0f16\], body.light-mode .bg-\[\#040609\], body.light-mode .bg-\[\#111622\], body.light-mode .bg-\[\#06080d\] { background-color: #ffffff !important; border-color: #e5e7eb !important; color: #111 !important; box-shadow: none !important; }
        body.light-mode .text-gray-100, body.light-mode .text-white { color: #111 !important; }
        body.light-mode .text-gray-300, body.light-mode .text-gray-400, body.light-mode .text-gray-500 { color: #444 !important; }
        body.light-mode .text-cyan-400 { color: #0891b2 !important; }
        body.light-mode .border-slate-700, body.light-mode .border-slate-800 { border-color: #ddd !important; }
        body.light-mode input, body.light-mode textarea { background-color: #f9fafb !important; color: #111 !important; border-color: #ccc !important; }
        body.light-mode .from-\[\#1b2b38\], body.light-mode .to-\[\#121c25\] { background: #dcf8c6 !important; color: #111 !important; border-color: #d1f4ba !important; }
        body.light-mode .from-\[\#121821\], body.light-mode .to-\[\#0c1016\] { background: #ffffff !important; color: #111 !important; border-color: #eee !important; }
    </style>
</head>
<body class="bg-[#06080c] text-gray-100 font-sans h-screen w-screen overflow-hidden antialiased relative selection:bg-cyan-500/30" id="mainBody">

    <!-- Ana Uygulama Kapsayıcısı -->
    <div id="app" class="h-full w-full flex flex-col justify-center items-center"></div>

    <!-- Bildirimler -->
    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Gizli Dosya Girdileri -->
    <input type="file" id="chatFileInput" class="hidden" onchange="handleChatFile(event)">
    <input type="file" id="bgFileInput" class="hidden" accept="image/*" onchange="handleBgFile(event)">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sohbetod-pro-app';
        const firebaseConfig = { apiKey: "mock-key", projectId: "mock-project" };
        
        let app, auth, dbFirestore;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            dbFirestore = getFirestore(app);
        } catch (e) {
            console.warn("Firebase simülasyon modu aktif.");
        }

        window.db = {
            users: [], 
            rooms: [
                { id: 'sys_ai', name: 'Sohbetod AI Asistanı', type: 'ai', photoURL: 'logo.jpg', about: 'Sohbetod Resmi Yapay Zekası', participants: ['system'], creator: 'system', admins: [] },
                { id: 'sys_feedback', name: 'Şikayet ve Öneriler', type: 'system', photoURL: 'logo.jpg', about: 'Yönetime Ulaşın', participants: ['system'], creator: 'system', admins: [] }
            ],
            messages: [],
            statusUpdates: [],
            feedbacks: []
        };

        // Ayarlar & Temalar
        window.themeMode = localStorage.getItem('sohbetod_theme') || 'dark';
        window.chatBg = localStorage.getItem('sohbetod_chatbg') || '';
        if(window.themeMode === 'light') document.body.classList.add('light-mode');

        // Oturum ve Yönlendirme (Direkt Login ekranı)
        window.currentUserUid = localStorage.getItem('sohbetod_current_uid') || null;
        window.user = null;
        window.authStep = window.currentUserUid ? 'app' : 'login'; 
        
        window.activeTab = 'chats'; 
        window.activeRoom = null;
        window.activeToasts = []; 
        window.chatSearchQuery = ''; 
        window.searchType = 'user'; 

        // Modeller
        window.showSettingsModal = false;
        window.showNewGroupModal = false;
        window.showStatusModal = false;
        window.statusViewModal = { show: false, data: null };
        window.statusDetailModal = { show: false, statusData: null };
        window.showProfileModal = false;
        window.groupInspectModal = { show: false, room: null };
        window.groupInfoModal = { show: false, room: null };
        window.msgOptionsModal = { show: false, msg: null };

        window.aiGeneratingText = false;
        window.replyingMessage = null;

        // Ses Kaydı
        window.isRecording = false;
        window.mediaRecorder = null;
        window.audioChunks = [];
        
        // Geçici Medya
        window.tempStatusFileUrl = null;
        window.tempStatusFileType = 'none';
        window.tempStatusMusicUrl = null;
        window.tempProfileFileUrl = null;
        window.tempGroupFileUrl = null;

        // Dosyayı Base64'e çevir
        window.fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // Şifre Göster/Gizle
        window.togglePasswordVisibility = function(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + '-icon');
            if(!input) return;
            if(input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            if(window.lucide) window.lucide.createIcons();
        }

        window.formatText = function(text) {
            if(!text) return "";
            let html = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            html = html.replace(/!\[.*?\]\((.*?)\)/g, '<img src="$1" class="w-full max-w-[300px] rounded-xl my-2 shadow-md border border-slate-700">');
            html = html.replace(/(https?:\/\/[^\s]+(?:\.jpg|\.jpeg|\.png|\.gif|\.webp))/g, '<img src="$1" class="w-full max-w-[250px] rounded-xl my-2 shadow-md">');
            html = html.replace(/\*(.*?)\*/g, '<b class="font-bold">$1</b>'); 
            html = html.replace(/_(.*?)_/g, '<i class="italic text-cyan-500">$1</i>'); 
            html = html.replace(/\n/g, '<br/>');
            return html;
        }

        window.showToast = function(msg, type = 'info') {
            let id = Date.now();
            window.activeToasts.push({ id, msg, type });
            window.renderToasts();
            setTimeout(() => {
                window.activeToasts = window.activeToasts.filter(t => t.id !== id);
                window.renderToasts();
            }, 3000);
        }

        window.renderToasts = function() {
            const container = document.getElementById('toast-container');
            if(!container) return;
            container.innerHTML = window.activeToasts.map(t => `
                <div class="bg-[#111622]/95 backdrop-blur-md border ${t.type === 'error' ? 'border-rose-500/50' : 'border-cyan-500/50'} text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-slide-in max-w-sm glass-panel">
                    <i data-lucide="${t.type === 'error' ? 'alert-circle' : 'check-circle'}" class="w-5 h-5 ${t.type === 'error' ? 'text-rose-400' : 'text-cyan-400'}"></i>
                    <span class="text-xs font-medium leading-relaxed">${t.msg}</span>
                </div>
            `).join('');
            if(window.lucide) window.lucide.createIcons();
        }

        window.generateAvatar = function(name, url) {
            if (url && url !== 'logo.jpg' && (url.startsWith('http') || url.startsWith('blob:') || url.startsWith('data:'))) return `<img src="${url}" onerror="this.src='logo.jpg'" class="w-full h-full object-cover">`;
            if (url === 'logo.jpg') return `<div class="w-full h-full bg-slate-900 flex items-center justify-center text-cyan-400 font-extrabold text-xl shadow-inner border border-cyan-500/30">S</div>`;
            let letter = name ? name.charAt(0).toUpperCase() : '?';
            return `<div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-cyan-600 to-blue-600 text-white font-bold text-lg shadow-inner">${letter}</div>`;
        }

        window.isContact = function(targetUid) {
            if (targetUid === window.user?.uid) return true;
            return window.db.rooms.some(r => r.type !== 'system' && r.type !== 'ai' && r.participants.includes(window.user?.uid) && r.participants.includes(targetUid));
        }

        window.changeAuthStep = function(step) { window.authStep = step; window.render(); }

        window.registerUser = function() {
            const email = document.getElementById('regEmail').value.trim();
            const name = document.getElementById('regName').value.trim();
            const password = document.getElementById('regPass').value.trim();
            
            if(!email || !name || !password) return window.showToast('Lütfen tüm alanları doldurun.', 'error');
            if(password.length < 6) return window.showToast('Şifreniz en az 6 haneli olmalıdır!', 'error');
            
            let localUsers = JSON.parse(localStorage.getItem('sohbetod_mock_users') || '[]');
            if(localUsers.find(u => u.email === email) || window.db.users.find(u => u.email === email)) return window.showToast('Bu E-posta zaten kayıtlı!', 'error');

            const newUid = 'usr_' + Date.now().toString(36);
            const userData = { uid: newUid, email: email, displayName: name, password: password, photoURL: '', about: 'Sohbetod kullanıyorum.' };

            localUsers.push(userData);
            localStorage.setItem('sohbetod_mock_users', JSON.stringify(localUsers));
            window.db.users.push(userData);
            
            window.currentUserUid = newUid; 
            window.user = userData;
            localStorage.setItem('sohbetod_current_uid', newUid);
            window.authStep = 'app';
            window.showToast('Kayıt başarılı! Sohbetod\'a hoş geldin.');
            window.render();
            
            if(dbFirestore) setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'users', newUid), userData).catch(()=>{});
        }

        window.loginUser = function() {
            const email = document.getElementById('logEmail').value.trim();
            const password = document.getElementById('logPass').value.trim();
            if(!email || !password) return window.showToast('Tüm bilgileri eksiksiz girin.', 'error');

            let localUsers = JSON.parse(localStorage.getItem('sohbetod_mock_users') || '[]');
            const foundUser = localUsers.find(u => u.email === email && u.password === password) || window.db.users.find(u => u.email === email && u.password === password);
            
            if(foundUser) {
                window.currentUserUid = foundUser.uid; window.user = foundUser;
                localStorage.setItem('sohbetod_current_uid', foundUser.uid);
                window.authStep = 'app';
                window.showToast('Başarıyla giriş yapıldı!'); window.render();
            } else { window.showToast('E-posta veya Şifre hatalı!', 'error'); }
        }

        window.logoutApp = function() {
            window.currentUserUid = null; window.user = null;
            localStorage.removeItem('sohbetod_current_uid');
            window.authStep = 'login'; window.activeRoom = null;
            window.render();
        }

        window.toggleTheme = function() {
            window.themeMode = window.themeMode === 'dark' ? 'light' : 'dark';
            localStorage.setItem('sohbetod_theme', window.themeMode);
            if(window.themeMode === 'light') document.body.classList.add('light-mode');
            else document.body.classList.remove('light-mode');
            window.render();
        }

        window.handleBgFile = async function(e) {
            const file = e.target.files[0];
            if(!file) return;
            if(file.size > 500 * 1024 * 1024) return window.showToast('Çok büyük dosya (Max 500MB).', 'error');
            try {
                const b64 = await window.fileToBase64(file);
                window.chatBg = `url(${b64})`;
                localStorage.setItem('sohbetod_chatbg', window.chatBg);
                window.showToast('Arkaplan güncellendi!');
                window.render();
            } catch(e) { window.showToast('Resim yüklenemedi.', 'error'); }
        }

        window.setBgColor = function(color) {
            window.chatBg = color;
            localStorage.setItem('sohbetod_chatbg', color);
            window.render();
        }

        window.handleChatFile = async function(e) {
            const file = e.target.files[0];
            if(!file) return;
            if(file.size > 500 * 1024 * 1024) return window.showToast('Dosya limiti 500MB.', 'error');

            try {
                const base64 = await window.fileToBase64(file);
                let type = 'file';
                if(file.type.startsWith('image/')) type = 'image';
                else if(file.type.startsWith('video/')) type = 'video';
                else if(file.type.startsWith('audio/')) type = 'audio';

                window.sendChatMessage('', { type, url: base64, name: file.name });
            } catch (err) { window.showToast('Dosya boyutu cihaz belleğini aştı!', 'error'); }
            e.target.value = ''; 
        }

        window.toggleVoiceRecord = async function() {
            if(window.isRecording) {
                window.mediaRecorder.stop();
                window.isRecording = false;
                window.render();
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    window.mediaRecorder = new MediaRecorder(stream);
                    window.audioChunks = [];
                    window.mediaRecorder.ondataavailable = e => window.audioChunks.push(e.data);
                    window.mediaRecorder.onstop = async () => {
                        const blob = new Blob(window.audioChunks, { type: 'audio/webm' });
                        if(blob.size > 500 * 1024 * 1024) return window.showToast('Ses kaydı çok uzun (Max 500MB).', 'error');
                        try {
                            const base64 = await window.fileToBase64(blob);
                            window.sendChatMessage('', { type: 'audio', url: base64, name: 'Sesli Mesaj.webm' });
                        } catch(e) { window.showToast('Ses kaydedilemedi.', 'error'); }
                        stream.getTracks().forEach(t => t.stop());
                    };
                    window.mediaRecorder.start();
                    window.isRecording = true;
                    window.render();
                } catch(err) { window.showToast("Mikrofon izni reddedildi.", "error"); }
            }
        }

        window.triggerProfileFileInput = function() { document.getElementById('hiddenProfileFileInput').click(); }
        window.handleProfileFile = async function(e) {
            const file = e.target.files[0];
            if(!file) return;
            if(file.size > 500 * 1024 * 1024) return window.showToast('Dosya boyutu çok büyük (Max: 500MB).', 'error');
            try {
                window.tempProfileFileUrl = await window.fileToBase64(file);
                document.getElementById('profPhotoPreview').innerHTML = window.generateAvatar(window.user.displayName, window.tempProfileFileUrl);
                window.showToast('Resim seçildi. Kaydetmeyi unutmayın.');
            } catch (e) { window.showToast('Resim yüklenemedi.', 'error'); }
        }

        window.updateProfile = async function() {
            const newName = document.getElementById('profName').value.trim();
            const newAbout = document.getElementById('profAbout').value.trim();
            let finalPhotoUrl = window.user.photoURL;

            const linkInput = document.getElementById('profPhotoLink').value.trim();
            if (window.tempProfileFileUrl) finalPhotoUrl = window.tempProfileFileUrl; 
            else if (linkInput) finalPhotoUrl = linkInput;

            if(!newName) return window.showToast('İsim boş bırakılamaz.', 'error');
            
            window.user.displayName = newName;
            window.user.photoURL = finalPhotoUrl;
            window.user.about = newAbout;

            try {
                let localUsers = JSON.parse(localStorage.getItem('sohbetod_mock_users') || '[]');
                let index = localUsers.findIndex(u=>u.uid === window.user.uid);
                if(index > -1) localUsers[index] = window.user;
                localStorage.setItem('sohbetod_mock_users', JSON.stringify(localUsers));

                let dbIndex = window.db.users.findIndex(u=>u.uid === window.user.uid);
                if(dbIndex > -1) window.db.users[dbIndex] = window.user;

                if(dbFirestore) await updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'users', window.user.uid), window.user);
                window.showToast('Profil başarıyla güncellendi.');
                window.showProfileModal = false;
                window.tempProfileFileUrl = null; 
                window.render();
            } catch(e) { window.showToast('Bulut kaydı başarısız, veriler cihazda tutuluyor.', 'info'); window.render(); }
        }

        window.sendChatMessage = async function(text, media = null) {
            if(!window.activeRoom) return;

            const msgId = 'msg_' + Date.now();
            const newMsg = {
                id: msgId, roomId: window.activeRoom.id, senderId: window.user.uid, senderName: window.user.displayName,
                text: text, timestamp: new Date().toISOString(), type: media ? media.type : 'text', isDeleted: false, deletedFor: [], reactions: {}
            };

            if(media) { newMsg.mediaUrl = media.url; newMsg.mediaName = media.name; }
            if(window.replyingMessage) { newMsg.replyToSender = window.replyingMessage.senderName; newMsg.replyToText = window.replyingMessage.text; window.replyingMessage = null; }

            try {
                if(window.activeRoom.id === 'sys_feedback') {
                    const feedbackData = { id: msgId, senderId: window.user.uid, senderEmail: window.user.email, senderName: window.user.displayName, text: text, status: 'İletiliyor...', timestamp: new Date().toISOString() };
                    window.db.feedbacks.push(feedbackData);
                    if(dbFirestore) setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'feedbacks', msgId), feedbackData).catch(()=>{});
                    window.render();
                    setTimeout(() => {
                        feedbackData.status = 'yunusizzeddinguder@gmail.com adresine başarıyla yönlendirildi';
                        if(dbFirestore) updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'feedbacks', msgId), { status: feedbackData.status }).catch(()=>{});
                        window.render();
                    }, 2000);
                } else {
                    window.db.messages.push(newMsg);
                    if(dbFirestore) setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'messages', msgId), newMsg).catch(()=>{});
                    window.scrollToBottom();

                    // GELİŞMİŞ SOHBETOD AI (Hızlı ve Akıllı Yanıt Sistemi)
                    if(window.activeRoom.id === 'sys_ai') {
                        window.aiGeneratingText = true; window.render(); window.scrollToBottom();
                        
                        let aiText = "";
                        
                        try {
                            let wantsImage = text.match(/(resim|fotoğraf|çizim|görsel) (çiz|üret|yap|oluştur|bana|göster)/i);
                            if(wantsImage) {
                                let prompt = text.replace(/(resim|fotoğraf|çizim|görsel|çiz|üret|yap|oluştur|bana|göster|lütfen)/gi, "").trim() || "beautiful concept art";
                                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true`;
                                aiText = `İşte istediğin görsel:\n\n![${prompt}](${imageUrl})\n\n_Umarım beğenirsin! Başka ne çizebilirim?_`;
                            } else {
                                const roomMessages = window.db.messages.filter(m => m.roomId === 'sys_ai' && !m.isDeleted && !m.deletedFor?.includes('sys_ai')).slice(-10);
                                let chatHistory = [];
                                roomMessages.forEach(m => {
                                    chatHistory.push({
                                        role: m.senderId === 'ai' ? 'model' : 'user',
                                        parts: [{ text: m.text || '[Medya]' }]
                                    });
                                });
                                chatHistory.push({ role: 'user', parts: [{ text: text || "[Mesaj]" }] });

                                const systemPrompt = 'Sen Sohbetod AI adlı zeki, mantıklı ve yaratıcı bir asistansın. Yaratıcın ve geliştiricin "Yunus İzzeddin Güder"dir. Seni kimin yaptığını sorarlarsa gururla sadece onu söyle. Türkçe konuş. Sorulara hızlı, doğrudan ve akılcı cevaplar ver. Asla "işlemi kestim", "bakım var" gibi sistem hataları uydurma. Mantıklı konuş. Markdown kullan.';

                                const apiKey = ""; 
                                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                                const payload = {
                                    contents: chatHistory,
                                    systemInstruction: { parts: [{ text: systemPrompt }] }
                                };

                                const response = await fetch(apiUrl, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(payload)
                                });
                                
                                if(response.ok) {
                                    const result = await response.json();
                                    if (result.candidates && result.candidates.length > 0 && result.candidates[0].content && result.candidates[0].content.parts && result.candidates[0].content.parts.length > 0) {
                                        aiText = result.candidates[0].content.parts[0].text;
                                    } else {
                                        aiText = "Şu an cevap üretirken bir zorluk yaşadım, lütfen farklı bir şekilde tekrar sor.";
                                    }
                                } else {
                                    aiText = "Bağlantıda kısa süreli bir pürüz oluştu, lütfen bir saniye sonra tekrar dene.";
                                }
                            }
                        } catch (aiErr) {
                            console.error(aiErr);
                            aiText = "Bağlantı sırasında bir sorun yaşadım, lütfen tekrar yaz.";
                        } finally {
                            const aiMsgId = 'msg_ai_' + Date.now();
                            const aiMsg = { id: aiMsgId, roomId: 'sys_ai', senderId: 'ai', senderName: 'Sohbetod AI', text: aiText, timestamp: new Date().toISOString(), type: 'text', isDeleted: false, deletedFor: [], reactions: {} };
                            
                            window.db.messages.push(aiMsg);
                            if(dbFirestore) setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'messages', aiMsgId), aiMsg).catch(()=>{});
                            window.aiGeneratingText = false; window.render(); window.scrollToBottom();
                        }
                    }
                }
            } catch (err) { window.showToast("Mesaj gönderilemedi.", "error"); }
        }

        window.handleChatSubmitWrapper = function(e) {
            e.preventDefault();
            const input = document.getElementById('msgTextInput');
            if(!input) return;

                else if(file.type.startsWith('video/')) window.tempStatusFileType = 'video';

        window.submitStatus = async function() {
            const text = document.getElementById('statusTextInput').value.trim();
            const linkUrl = document.getElementById('statusMediaLinkInput').value.trim();
            let finalMediaUrl = ''; let finalMediaType = 'none';

            if (window.tempStatusFileUrl) { finalMediaUrl = window.tempStatusFileUrl; finalMediaType = window.tempStatusFileType; } 
            else if (linkUrl) {
                finalMediaUrl = linkUrl;
                if(linkUrl.match(/\.(jpeg|jpg|gif|png|webp)/i)) finalMediaType = 'image';
                else if(linkUrl.match(/\.(mp4|webm|ogg)/i)) finalMediaType = 'video';
                else if(linkUrl.match(/\.(mp3|wav)/i)) finalMediaType = 'audio';
                else finalMediaType = 'link'; 
            }
            if(!text && !finalMediaUrl) return window.showToast('Metin veya medya eklemelisiniz.', 'error');

            const statusId = 'st_' + Date.now();
            const statusData = { id: statusId, userId: window.user.uid, userName: window.user.displayName, userAvatar: window.user.photoURL, content: text, mediaType: finalMediaType, mediaUrl: finalMediaUrl, musicUrl: window.tempStatusMusicUrl, timestamp: new Date().toISOString(), viewers: [], likes: [] };

            window.db.statusUpdates.push(statusData);
            if(dbFirestore) setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'statusUpdates', statusId), statusData).catch(()=>{});

        window.initApp = async function() {
            let localUsers = JSON.parse(localStorage.getItem('sohbetod_mock_users') || '[]');
            if(localUsers.length > 0) window.db.users = localUsers;

            if(window.currentUserUid) {
                window.user = window.db.users.find(u => u.uid === window.currentUserUid);
                if(window.user) window.authStep = 'app';
            }

            if(auth) {
                try {
                    await signInAnonymously(auth);
                    const collections = ['users', 'rooms', 'messages', 'statusUpdates', 'feedbacks'];
                    collections.forEach(colName => {
                        onSnapshot(collection(dbFirestore, 'artifacts', appId, 'public', 'data', colName), (snapshot) => {
                            let cloudData = snapshot.docs.map(doc => doc.data());
                            if(colName === 'users') {
                                cloudData.forEach(cu => { if(!window.db.users.find(lu => lu.uid === cu.uid)) window.db.users.push(cu); });
                                if(window.currentUserUid) {
                                    window.user = window.db.users.find(u => u.uid === window.currentUserUid);
                                    if(!window.user && window.authStep === 'app') window.logoutApp();
                                }
                            } else {
                                window.db[colName] = cloudData;
                            }
                            if(colName === 'rooms') {
                                if(!window.db.rooms.find(r=>r.id === 'sys_ai')) window.db.rooms.push({ id: 'sys_ai', name: 'Sohbetod AI Asistanı', type: 'ai', photoURL: 'logo.jpg', about: 'Sohbetod Resmi Yapay Zekası', participants: ['system'], creator: 'system', admins:[] });
                                if(!window.db.rooms.find(r=>r.id === 'sys_feedback')) window.db.rooms.push({ id: 'sys_feedback', name: 'Şikayet ve Öneriler', type: 'system', photoURL: 'logo.jpg', about: 'Yönetime Ulaşın', participants: ['system'], creator: 'system', admins:[] });
                            }
                            window.render();
                        }, (e) => console.warn("Firebase Sync Hatası"));
                    });
                } catch (e) { console.warn("Sadece Yerel Mod Çalışıyor."); }
            }
            window.render();
        }

                                        <div class="flex gap-2">
                                            <button onclick="saveGroupSettings()" class="flex-1 py-2 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg text-xs">Kaydet</button>
                                            <button onclick="addMemberToGroup()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-lg text-xs flex items-center justify-center gap-1"><i data-lucide="user-plus" class="w-3 h-3"></i> Üye Ekle</button>
                                        </div>
                                    </div>
                                ` : `
                                    <div class="text-center mb-6">
                                        <div class="w-20 h-20 mx-auto rounded-full border-2 border-slate-700 overflow-hidden mb-2">${window.generateAvatar(r.name, r.photoURL)}</div>
                                        <h4 class="font-bold text-white text-lg">${r.name}</h4>
                                        <p class="text-xs text-gray-400 italic">${r.about}</p>
                                    </div>
                                `}
                                <h4 class="text-[10px] font-bold text-gray-500 mb-2 uppercase tracking-wide">Üyeler (${r.participants.length})</h4>
                                <div class="space-y-2">
                                    ${r.participants.map(pUid => {
                                        let pUser = window.db.users.find(u=>u.uid === pUid);
                                        let isThisAdmin = r.admins?.includes(pUid);
                                        return `
                                        <div class="flex items-center justify-between bg-slate-800/30 p-2 rounded-xl border border-slate-800">
                                            <div class="flex items-center gap-2">
                                                <div class="w-8 h-8 rounded-full overflow-hidden border border-slate-600">${pUser ? window.generateAvatar(pUser.displayName, pUser.photoURL) : ''}</div>
                                                <div><div class="text-xs text-white font-bold">${pUser ? pUser.displayName : 'Bilinmeyen'} ${pUid===window.user.uid?'(Sen)':''}</div><div class="text-[9px] ${isThisAdmin?'text-cyan-400':'text-gray-500'}">${isThisAdmin?'Yönetici':'Üye'}</div></div>
                                            </div>
                                            ${isAdmin && !isThisAdmin && pUser ? `<button onclick="makeGroupAdmin('${pUid}')" class="text-[9px] bg-slate-700 hover:bg-cyan-600 text-white px-2 py-1 rounded">Yönetici Yap</button>` : ''}
                                        </div>`
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    </div>`
                })() : ''}

                ${window.msgOptionsModal.show && window.msgOptionsModal.msg ? `
                    <div class="fixed inset-0 z-[100] bg-black/60 flex items-end sm:items-center justify-center sm:p-4 animate-fade-in" onclick="closeMsgOptions()">
                        <div class="w-full sm:max-w-sm bg-[#0c0f16] rounded-t-3xl sm:rounded-3xl border-t sm:border border-slate-700 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] p-4 animate-slide-up" onclick="event.stopPropagation()">
                            <div class="w-12 h-1 bg-slate-700 rounded-full mx-auto mb-4 sm:hidden"></div>
                            <div class="flex justify-between items-center mb-4 px-2">
                                <span class="text-xs font-bold text-gray-400">Mesaj Seçenekleri</span>
                                <button onclick="closeMsgOptions()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
                            </div>
                            
                            <div class="bg-slate-900/50 p-3 rounded-2xl border border-slate-800 mb-4 flex justify-between items-center">
                                <span class="text-xs text-gray-400 font-bold ml-1">Tepki:</span>
                                <div class="flex gap-2 text-xl">
                                    <button onclick="addReaction('👍')" class="hover:scale-125 transition-transform cursor-pointer">👍</button>
                                    <button onclick="addReaction('❤️')" class="hover:scale-125 transition-transform cursor-pointer">❤️</button>
                                    <button onclick="addReaction('😂')" class="hover:scale-125 transition-transform cursor-pointer">😂</button>
                                    <button onclick="addReaction('😮')" class="hover:scale-125 transition-transform cursor-pointer">😮</button>
                                    <button onclick="addReaction('😢')" class="hover:scale-125 transition-transform cursor-pointer">😢</button>
                                </div>
                            </div>

                            <div class="space-y-1">
                                <button onclick="setReplyMessage()" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-800/80 text-white text-sm transition-colors"><i data-lucide="reply" class="w-4 h-4 text-cyan-400"></i> Yanıtla</button>
                                <button onclick="deleteMsgForMe()" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-800/80 text-white text-sm transition-colors"><i data-lucide="eye-off" class="w-4 h-4 text-gray-400"></i> Benden Sil</button>
                                ${window.msgOptionsModal.msg.senderId === window.user.uid ? `<button onclick="deleteMsgForEveryone()" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-rose-500/20 text-rose-400 text-sm transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i> Herkesten Sil</button>` : ''}
                            </div>
                        </div>
                    </div>` : ''}

                ${window.showStatusModal ? `
                    <div class="fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
                        <div class="w-full max-w-md bg-[#0c0f16] p-6 rounded-3xl border border-slate-700 shadow-2xl animate-pop">
                            <div class="flex justify-between items-center mb-6"><h3 class="font-bold text-lg text-white">Durum Paylaş</h3><button onclick="openStatusModal(false)" class="p-1.5 bg-slate-800 rounded-lg text-gray-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button></div>
                            <div class="space-y-4">
                                <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-800 border-dashed text-center">
                                    <input type="file" id="hiddenStatusFileInput" class="hidden" accept="image/*,video/*,audio/*" onchange="handleStatusFile(event)">
                                    <button onclick="triggerStatusFileInput()" class="mx-auto flex flex-col items-center gap-2 text-cyan-400 hover:text-cyan-300 transition-colors">
                                        <div class="w-12 h-12 rounded-full bg-cyan-900/30 flex items-center justify-center"><i data-lucide="upload-cloud" class="w-6 h-6"></i></div>
                                        <span class="text-xs font-bold">Cihazdan Dosya Seç (Max 500MB)</span>
                                    </button>
                                    <div id="statusFileNameDisplay" class="text-[10px] text-gray-500 mt-3 h-4"></div>
                                </div>
                                <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-800 text-center">
                                    <input type="file" id="hiddenStatusMusicInput" class="hidden" accept="audio/*" onchange="handleStatusMusic(event)">
                                    <button onclick="triggerStatusMusicInput()" class="text-xs text-emerald-400 hover:text-emerald-300 font-bold flex items-center justify-center gap-1.5 mx-auto"><i data-lucide="music" class="w-4 h-4"></i> Arkaplan Müziği Ekle</button>
                                    <div id="statusMusicNameDisplay" class="text-[10px] text-gray-500 mt-2 h-3"></div>
                                </div>
                                <div><textarea id="statusTextInput" placeholder="Durum açıklaması / Videoya yazı ekle..." class="w-full px-4 py-3 bg-[#111622] rounded-xl text-sm border border-slate-700 outline-none text-white h-20 resize-none focus:border-cyan-500"></textarea></div>
                                <button onclick="submitStatus()" class="w-full py-3.5 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold rounded-xl text-sm shadow-lg hover:opacity-90 transition-opacity">Durumumu Paylaş</button>
                            </div>
                        </div>
                    </div>` : ''}

                ${window.statusViewModal.show && window.statusViewModal.data ? `
                    <div class="fixed inset-0 z-[90] bg-black flex items-center justify-center p-4 sm:p-8 animate-fade-in">
                        <button onclick="closeStatusView()" class="absolute top-4 right-4 p-2 bg-slate-800/80 rounded-full text-white z-30 hover:bg-slate-700"><i data-lucide="x" class="w-6 h-6"></i></button>
                        <div class="w-full max-w-md h-full max-h-[85vh] bg-slate-900 relative rounded-2xl overflow-hidden flex flex-col shadow-[0_0_50px_rgba(0,0,0,0.8)] border border-slate-700">
                            <div class="absolute top-0 w-full p-4 bg-gradient-to-b from-black/90 to-transparent flex items-center gap-3 z-30">
                                <div class="w-10 h-10 rounded-full border border-white/30 overflow-hidden shadow-lg shrink-0">${window.generateAvatar(window.statusViewModal.data[0].userName, window.statusViewModal.data[0].userAvatar)}</div>
                                <div class="flex-1"><div class="font-bold text-white text-sm drop-shadow-md">${window.statusViewModal.data[0].userName}</div><div class="text-[10px] text-gray-300 drop-shadow-md">${new Date(window.statusViewModal.data[0].timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div></div>
                            </div>
                            
                            <div class="flex-1 flex flex-col items-center justify-center bg-gradient-to-br from-[#0a0715] to-[#111622] relative overflow-hidden z-10">
                                ${window.statusViewModal.data[0].mediaType === 'image' ? `<img src="${window.statusViewModal.data[0].mediaUrl}" class="w-full h-full object-contain z-10">` : 
                                  window.statusViewModal.data[0].mediaType === 'video' ? `<video src="${window.statusViewModal.data[0].mediaUrl}" class="w-full h-full object-contain z-10" autoplay controls loop></video>` : 
                                  window.statusViewModal.data[0].mediaType === 'audio' ? `<div class="p-8 text-center z-10"><div class="w-24 h-24 bg-cyan-900/30 rounded-full flex items-center justify-center mx-auto mb-6 animate-pulse-soft"><i data-lucide="music" class="w-12 h-12 text-cyan-400"></i></div><audio src="${window.statusViewModal.data[0].mediaUrl}" controls class="w-full"></audio></div>` : ''}
                                
                                ${window.statusViewModal.data[0].musicUrl ? `<audio src="${window.statusViewModal.data[0].musicUrl}" autoplay loop></audio>` : ''}
                                
                                ${window.statusViewModal.data[0].content ? `<div class="absolute inset-0 flex items-center justify-center p-6 z-20 pointer-events-none"><p class="text-white text-2xl font-extrabold drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] text-center break-words leading-tight" style="text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;">${window.formatText(window.statusViewModal.data[0].content)}</p></div>` : ''}
                            </div>
                            
                            <div class="p-4 flex justify-between items-center absolute bottom-0 w-full bg-gradient-to-t from-black/90 to-transparent z-30">
                                ${window.statusViewModal.data[0].userId === window.user.uid ? `
                                    <button onclick="viewStatusStats('${window.statusViewModal.data[0].id}')" class="flex flex-col items-center gap-1 text-white opacity-80 hover:opacity-100 p-2">
                                        <i data-lucide="eye" class="w-5 h-5"></i><span class="text-[10px] font-bold">${window.statusViewModal.data[0].viewers.length}</span>
                                    </button>
                                ` : '<div></div>'}
                                
                                <div class="flex flex-col items-center gap-1">
                                    <button onclick="likeStatus('${window.statusViewModal.data[0].id}')" class="bg-black/40 p-3 rounded-full border border-white/20 hover:bg-rose-500/20 cursor-pointer group transition-colors shadow-lg">
                                        <i data-lucide="heart" class="w-6 h-6 ${window.statusViewModal.data[0].likes.includes(window.user.uid) ? 'text-rose-500 fill-rose-500' : 'text-white'} group-hover:scale-110 transition-transform"></i>
                                    </button>
                                    <span class="text-white text-[10px] font-bold drop-shadow-md">${window.statusViewModal.data[0].likes.length} Beğeni</span>
                                </div>
                            </div>
                        </div>
                    </div>` : ''}

                ${window.statusDetailModal.show && window.statusDetailModal.statusData ? `
                    <div class="fixed inset-0 z-[110] bg-black/60 flex items-end sm:items-center justify-center sm:p-4 animate-fade-in" onclick="closeStatusStats()">
                        <div class="w-full sm:max-w-sm bg-[#0c0f16] rounded-t-3xl sm:rounded-3xl border-t sm:border border-slate-700 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] p-5 animate-slide-up" onclick="event.stopPropagation()">
                            <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-sm text-white">Görüntüleme & Beğeniler</h3><button onclick="closeStatusStats()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button></div>
                            <div class="max-h-[50vh] overflow-y-auto custom-scrollbar space-y-2">
                                ${window.statusDetailModal.statusData.viewers.length === 0 ? '<p class="text-xs text-gray-500 text-center py-4">Henüz kimse görmedi.</p>' : ''}
                                ${window.statusDetailModal.statusData.viewers.map(uid => {
                                    let vUser = window.db.users.find(u=>u.uid === uid);
                                    let hasLiked = window.statusDetailModal.statusData.likes.includes(uid);
                                    if(!vUser) return '';
                                    return `
                                    <div class="flex items-center justify-between p-2 rounded-xl bg-slate-800/40 border border-slate-800">
                                        <div class="flex items-center gap-2">
                                            <div class="w-8 h-8 rounded-full overflow-hidden">${window.generateAvatar(vUser.displayName, vUser.photoURL)}</div>
                                            <span class="text-xs text-white font-bold">${vUser.displayName}</span>
                                        </div>
                                        ${hasLiked ? '<i data-lucide="heart" class="w-4 h-4 text-rose-500 fill-rose-500"></i>' : ''}
                                    </div>`
                                }).join('')}
                            </div>
                        </div>
                    </div>
                ` : ''}
            `;
            if(window.lucide) window.lucide.createIcons();
            
            if(activeElId) {
                const el = document.getElementById(activeElId);
                if(el) { el.focus(); try { el.setSelectionRange(activeSelectionStart, activeSelectionEnd); } catch(e){} }
            }
            if(window.activeRoom && document.activeElement?.id !== 'searchInput') setTimeout(window.scrollToBottom, 50);
        };
    </script>
</body>
</html>
