<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sohbetod Web Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulseSoft { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-slide-in { animation: slideIn 0.2s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        .animate-pulse-soft { animation: pulseSoft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-pop { animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        .typing-dot { animation: typing 1.4s infinite ease-in-out; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    </style>
</head>
<body id="mainBody" class="text-gray-100 font-sans h-screen w-screen overflow-hidden antialiased relative selection:bg-cyan-500/30 transition-colors duration-300">

    <!-- Bildirimler -->
    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Hidden Inputs -->
    <input type="file" id="chatFileInput" class="hidden" onchange="handleChatFile(event)">
    <input type="file" id="bgFileInput" class="hidden" accept="image/*" onchange="handleBgFile(event)">

    <div id="app" class="h-full w-full flex flex-col justify-center items-center bg-[#05070a]">
        <!-- Başlangıç Loader (Hızlı geçecek) -->
        <div class="w-20 h-20 rounded-full border-t-4 border-cyan-500 border-opacity-50 animate-spin mb-4 shadow-[0_0_15px_rgba(6,182,212,0.5)]"></div>
        <p class="text-cyan-400 font-bold text-sm tracking-widest animate-pulse-soft">BAŞLATILIYOR...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sohbetod-pro-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "mock-key", projectId: "mock-project" };
        
        let app, auth, dbFirestore;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            dbFirestore = getFirestore(app);
        } catch (e) {
            console.warn("Firebase mock mode.");
        }

        // --- GLOBAL STATE ---
        window.db = {
            users: JSON.parse(localStorage.getItem('sohbetod_local_users') || '[]'), 
            rooms: [
                { id: 'sys_ai', name: 'Sohbetod AI Asistanı', type: 'ai', photoURL: 'logo.jpg', about: 'Sohbetod Resmi Yapay Zekası', participants: ['system'], creator: 'system', admins: [] },
                { id: 'sys_feedback', name: 'Şikayet ve Öneriler', type: 'system', photoURL: 'logo.jpg', about: 'Yönetime Ulaşın', participants: ['system'], creator: 'system', admins: [] }
            ],
            messages: [], statusUpdates: [], notifications: [], feedbacks: []
        };

        window.currentUserUid = localStorage.getItem('sohbetod_current_uid') || null;
        window.user = window.db.users.find(u => u.uid === window.currentUserUid) || null;
        window.authStep = window.user ? 'app' : 'landing'; 
        
        window.activeTab = 'chats'; 
        window.activeRoom = null;
        window.activeToasts = []; 
        window.chatSearchQuery = ''; 
        window.searchType = 'user'; 

        // Tema Ayarları
        window.chatSettings = {
            theme: localStorage.getItem('sohbetod_theme') || 'dark', // 'dark' | 'light'
            bgType: localStorage.getItem('sohbetod_bgType') || 'default', // 'default' | 'color' | 'image'
            bgValue: localStorage.getItem('sohbetod_bgValue') || ''
        };

        // Modallar
        window.showNewGroupModal = false;
        window.showStatusModal = false;
        window.statusViewModal = { show: false, data: null };
        window.statusDetailModal = { show: false, statusData: null };
        window.showProfileModal = false;
        window.showSettingsModal = false;
        window.groupInspectModal = { show: false, room: null };
        window.groupInfoModal = { show: false, room: null };
        window.msgOptionsModal = { show: false, msg: null };

        window.aiGeneratingText = false;
        window.replyingMessage = null;
        window.isRecording = false;
        window.mediaRecorder = null;
        window.audioChunks = [];
        
        window.tempStatusFileUrl = null;
        window.tempStatusFileType = 'none';
        window.tempProfileFileUrl = null;
        window.newGroupPhotoUrl = null;

        window.fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        window.togglePasswordVisibility = function(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + '-icon');
            if(!input) return;
            if(input.type === 'password') { input.type = 'text'; icon.setAttribute('data-lucide', 'eye-off'); } 
            else { input.type = 'password'; icon.setAttribute('data-lucide', 'eye'); }
            if(window.lucide) window.lucide.createIcons();
        }

        window.formatText = function(text) {
            if(!text) return "";
            let html = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            html = html.replace(/!\[.*?\]\((.*?)\)/g, '<img src="$1" class="w-full max-w-[300px] rounded-xl my-2 shadow-md border border-slate-700">');
            html = html.replace(/(https?:\/\/[^\s]+(?:\.jpg|\.jpeg|\.png|\.gif|\.webp))/g, '<img src="$1" class="w-full max-w-[250px] rounded-xl my-2 shadow-md">');
            html = html.replace(/\*(.*?)\*/g, '<b>$1</b>'); 
            html = html.replace(/_(.*?)_/g, '<i>$1</i>'); 
            html = html.replace(/\n/g, '<br/>');
            return html;
        }

        window.showToast = function(msg, type = 'info') {
            let id = Date.now();
            window.activeToasts.push({ id, msg, type });
            window.renderToasts();
            setTimeout(() => { window.activeToasts = window.activeToasts.filter(t => t.id !== id); window.renderToasts(); }, 3000);
        }

        window.renderToasts = function() {
            const container = document.getElementById('toast-container');
            if(!container) return;
            container.innerHTML = window.activeToasts.map(t => `
                <div class="bg-gray-900/95 backdrop-blur-md border ${t.type === 'error' ? 'border-rose-500/50' : 'border-cyan-500/50'} text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-slide-in max-w-sm">
                    <i data-lucide="${t.type === 'error' ? 'alert-circle' : 'check-circle'}" class="w-5 h-5 ${t.type === 'error' ? 'text-rose-400' : 'text-cyan-400'}"></i>
                    <span class="text-xs font-medium leading-relaxed">${t.msg}</span>
                </div>
            `).join('');
            if(window.lucide) window.lucide.createIcons();
        }

        window.playSynthSound = function(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'sent') { osc.frequency.setValueAtTime(800, ctx.currentTime); gain.gain.setValueAtTime(0.08, ctx.currentTime); osc.start(); osc.stop(ctx.currentTime + 0.08); } 
                else if (type === 'received') { osc.frequency.setValueAtTime(600, ctx.currentTime); gain.gain.setValueAtTime(0.08, ctx.currentTime); osc.start(); osc.stop(ctx.currentTime + 0.12); }
            } catch (e) {}
        }

        window.generateAvatar = function(name, url) {
            if (url && url !== 'logo.jpg' && (url.startsWith('http') || url.startsWith('blob:') || url.startsWith('data:'))) return `<img src="${url}" onerror="this.src='logo.jpg'" class="w-full h-full object-cover">`;
            if (url === 'logo.jpg') return `<div class="w-full h-full bg-slate-900 flex items-center justify-center text-cyan-400 font-extrabold text-xl shadow-inner border border-cyan-500/30">S</div>`;
            let letter = name ? name.charAt(0).toUpperCase() : '?';
            return `<div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-cyan-600 to-blue-600 text-white font-bold text-lg shadow-inner">${letter}</div>`;
        }

        window.isContact = function(targetUid) {
            if (targetUid === window.user?.uid) return true;
            return window.db.rooms.some(r => r.type !== 'system' && r.type !== 'ai' && r.participants.includes(window.user?.uid) && r.participants.includes(targetUid));
        }

        window.changeAuthStep = function(step) { window.authStep = step; window.render(); }

        window.registerUser = async function() {
            const email = document.getElementById('regEmail').value.trim();
            const name = document.getElementById('regName').value.trim();
            const password = document.getElementById('regPass').value.trim();
            
            if(!email || !name || !password) return window.showToast('Lütfen tüm alanları doldurun.', 'error');
            if(password.length < 6) return window.showToast('Şifre en az 6 haneli olmalıdır.', 'error');
            if(window.db.users.find(u => u.email === email)) return window.showToast('Bu E-posta zaten kayıtlı!', 'error');
            if(window.db.users.find(u => u.displayName === name)) return window.showToast('Bu kullanıcı adı alınmış.', 'error');

            const newUid = 'usr_' + Date.now().toString(36) + Math.random().toString(36).substr(2);
            const userData = { uid: newUid, email: email, displayName: name, password: password, photoURL: '', about: 'Sohbetod kullanıyorum.' };

            // Önce yerel belleğe kesin kaydet (Offline-First Mantığı)
            window.db.users.push(userData);
            localStorage.setItem('sohbetod_local_users', JSON.stringify(window.db.users));
            window.currentUserUid = newUid; 
            window.user = userData;
            localStorage.setItem('sohbetod_current_uid', newUid);
            
            window.authStep = 'app';
            window.showToast('Kayıt başarılı! Hoş geldin.');
            window.render();

            // Arka planda buluta işle
            if(dbFirestore) {
                try { await setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'users', newUid), userData); } 
                catch (e) { console.warn("Bulut gecikmesi, yerel kayıt geçerli."); }
            }
        }

        window.loginUser = function() {
            const email = document.getElementById('logEmail').value.trim();
            const password = document.getElementById('logPass').value.trim();
            if(!email || !password) return window.showToast('Tüm bilgileri girin.', 'error');

            const foundUser = window.db.users.find(u => u.email === email && u.password === password);
            if(foundUser) {
                window.currentUserUid = foundUser.uid; 
                window.user = foundUser;
                localStorage.setItem('sohbetod_current_uid', foundUser.uid);
                window.authStep = 'app';
                window.showToast('Başarıyla giriş yapıldı!'); 
                window.render();
            } else { window.showToast('E-posta veya Şifre hatalı!', 'error'); }
        }

        window.logoutApp = function() {
            window.currentUserUid = null; window.user = null;
            localStorage.removeItem('sohbetod_current_uid');
            window.authStep = 'landing'; window.activeRoom = null;
            window.render();
        }

        window.handleChatFile = async function(e) {
            const file = e.target.files[0];
            if(!file) return;
            // Limit 500 MB
            if(file.size > 500 * 1024 * 1024) return window.showToast('Dosya boyutu çok büyük (Max: 500MB).', 'error');

            window.showToast('Dosya işleniyor, lütfen bekleyin...');
            try {
                const base64 = await window.fileToBase64(file);
                let type = 'file';
                if(file.type.startsWith('image/')) type = 'image';
                else if(file.type.startsWith('video/')) type = 'video';
                else if(file.type.startsWith('audio/')) type = 'audio';

                window.sendChatMessage('', { type, url: base64, name: file.name });
            } catch(err) { window.showToast('Dosya okunamadı!', 'error'); }
            e.target.value = ''; 
        }

        window.toggleVoiceRecord = async function() {
            if(window.isRecording) {
                window.mediaRecorder.stop();
                window.isRecording = false;
                window.render();
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    window.mediaRecorder = new MediaRecorder(stream);
                    window.audioChunks = [];
                    window.mediaRecorder.ondataavailable = e => window.audioChunks.push(e.data);
                    window.mediaRecorder.onstop = async () => {
                        const blob = new Blob(window.audioChunks, { type: 'audio/webm' });
                        if(blob.size > 500 * 1024 * 1024) {
                            window.showToast('Ses kaydı çok büyük.', 'error');
                        } else {
                            const base64 = await window.fileToBase64(blob);
                            window.sendChatMessage('', { type: 'audio', url: base64, name: 'Sesli Mesaj.webm' });
                        }
                        stream.getTracks().forEach(t => t.stop());
                    };
                    window.mediaRecorder.start();
                    window.isRecording = true;
                    window.render();
                } catch(err) { window.showToast("Mikrofon izni gerekli.", "error"); }
            }
        }

        window.updateProfile = async function() {
            const newName = document.getElementById('profName').value.trim();
            const newAbout = document.getElementById('profAbout').value.trim();
            if(!newName) return window.showToast('İsim boş olamaz.', 'error');
            
            window.user.displayName = newName;
            window.user.about = newAbout;
            if (window.tempProfileFileUrl) window.user.photoURL = window.tempProfileFileUrl;

            // Yerel Kayıt (Sürekli Güncel)
            let uIdx = window.db.users.findIndex(u=>u.uid === window.user.uid);
            if(uIdx > -1) window.db.users[uIdx] = window.user;
            localStorage.setItem('sohbetod_local_users', JSON.stringify(window.db.users));

            try {
                if(dbFirestore) await updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'users', window.user.uid), window.user);
                window.showToast('Profil güncellendi.');
                window.showProfileModal = false; window.tempProfileFileUrl = null; window.render();
            } catch(e) { window.showToast('Profil kaydedildi (Yerel).', 'info'); window.showProfileModal=false; window.render(); }
        }

        window.applySettings = function(type, val) {
            if(type === 'theme') {
                window.chatSettings.theme = val;
                localStorage.setItem('sohbetod_theme', val);
            } else if (type === 'bg') {
                window.chatSettings.bgType = val;
                localStorage.setItem('sohbetod_bgType', val);
                if(val === 'color') {
                    let col = document.getElementById('bgColorPicker').value;
                    window.chatSettings.bgValue = col;
                    localStorage.setItem('sohbetod_bgValue', col);
                }
            }
            window.render();
        }

        window.handleBgFile = async function(e) {
            const file = e.target.files[0];
            if(!file) return;
            if(file.size > 500 * 1024 * 1024) return window.showToast('Max 500MB', 'error');
            const base64 = await window.fileToBase64(file);
            window.chatSettings.bgType = 'image';
            window.chatSettings.bgValue = base64;
            localStorage.setItem('sohbetod_bgType', 'image');
            localStorage.setItem('sohbetod_bgValue', base64);
            window.showToast('Arkaplan güncellendi');
            window.render();
        }

        window.switchTab = function(tab) { window.activeTab = tab; if(window.innerWidth < 768) window.activeRoom = null; window.render(); }
        window.selectRoom = function(roomId) { window.activeRoom = window.db.rooms.find(r => r.id === roomId); window.render(); setTimeout(() => window.scrollToBottom(), 100); }
        window.closeRoom = function() { window.activeRoom = null; window.render(); }
        window.scrollToBottom = function() { const end = document.getElementById('messagesEnd'); if (end) end.scrollIntoView({ behavior: 'smooth' }); }

        window.handleChatSubmitWrapper = function(e) {
            e.preventDefault();
            const input = document.getElementById('msgTextInput');
            let text = input.value.trim();
            if(!text) return;
            input.value = '';
            window.sendChatMessage(text);
        }

        window.sendChatMessage = async function(text, media = null) {
            if(!window.activeRoom) return;
            const msgId = 'msg_' + Date.now();
            const newMsg = {
                id: msgId, roomId: window.activeRoom.id, senderId: window.user.uid, senderName: window.user.displayName,
                text: text, timestamp: new Date().toISOString(), type: media ? media.type : 'text', isDeleted: false, deletedFor: [], reactions: {}
            };

            if(media) { newMsg.mediaUrl = media.url; newMsg.mediaName = media.name; }
            if(window.replyingMessage) { newMsg.replyToSender = window.replyingMessage.senderName; newMsg.replyToText = window.replyingMessage.text; window.replyingMessage = null; }

            // Şikayet Hattı
            if(window.activeRoom.id === 'sys_feedback') {
                const feedbackData = { id: msgId, senderId: window.user.uid, senderEmail: window.user.email, senderName: window.user.displayName, text: text, status: 'İletiliyor...', timestamp: new Date().toISOString() };
                if(dbFirestore) await setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'feedbacks', msgId), feedbackData);
                else window.db.feedbacks.push(feedbackData);
                window.playSynthSound('sent'); window.render();
                
                setTimeout(async () => {
                    feedbackData.status = 'yunusizzeddinguder@gmail.com adresine başarıyla yönlendirildi';
                    if(dbFirestore) await updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'feedbacks', msgId), { status: feedbackData.status });
                    window.render();
                }, 1500);
                return;
            }

            // Normal Mesaj Kaydı
            if(dbFirestore) await setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'messages', msgId), newMsg);
            else window.db.messages.push(newMsg);
            window.playSynthSound('sent'); window.scrollToBottom();

            // SOHBETOD AI (Kesin Çözümlü, Key'siz, Özgür Model)
            if(window.activeRoom.id === 'sys_ai') {
                window.aiGeneratingText = true; window.render(); window.scrollToBottom();
                
                let aiText = "";
                try {
                    let wantsImage = text.match(/(resim|fotoğraf|çizim|görsel) (çiz|üret|yap|oluştur|bana|göster)/i);

                    if(wantsImage) {
                        let prompt = text.replace(/(resim|fotoğraf|çizim|görsel|çiz|üret|yap|oluştur|bana|göster|lütfen)/gi, "").trim() || "beautiful concept art";
                        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true`;
                        aiText = `İşte istediğin görsel:\n\n![${prompt}](${imageUrl})\n\n_Umarım beğenirsin!_`;
                    } else {
                        // Kendi sitenizde ücretsiz ve sınırsız çalışabilen Text API'si
                        const roomMessages = window.db.messages.filter(m => m.roomId === 'sys_ai' && !m.isDeleted && !m.deletedFor?.includes('sys_ai')).slice(-8);
                        let messagesPayload = [
                            { role: 'system', content: "Sen 'Sohbetod AI' adlı zeki bir asistansın. Yaratıcın ve geliştiricin 'Yunus İzzeddin Güder'dir. Türkçe konuş. Sorulara net, doğrudan, mantıklı ve insansı cevaplar ver. Asla sistem arızasından, bakımdan veya ezberlenmiş sabit şablonlardan bahsetme. Kullanıcıyı anla ve ona göre doğal yanıtla." }
                        ];
                        
                        roomMessages.forEach(m => {
                            messagesPayload.push({ role: m.senderId === 'ai' ? 'assistant' : 'user', content: m.text || '[Kullanıcı Medya Gönderdi]' });
                        });
                        messagesPayload.push({ role: 'user', content: text || "[Mesaj]" });

                        const response = await fetch('https://text.pollinations.ai/', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ messages: messagesPayload })
                        });
                        
                        if(response.ok) {
                            aiText = await response.text();
                        } else {
                            aiText = "Bağlantıda çok ufak bir pürüz yaşadım, sorunu tekrar eder misin?"; // Doğal fallback
                        }
                    }
                } catch (aiErr) {
                    aiText = "Şu an internet trafiği biraz yoğun, cümleyi tekrar edersen hemen yardımcı olurum."; // Doğal fallback
                } finally {
                    const aiMsgId = 'msg_ai_' + Date.now();
                    const aiMsg = { id: aiMsgId, roomId: 'sys_ai', senderId: 'ai', senderName: 'Sohbetod AI', text: aiText, timestamp: new Date().toISOString(), type: 'text', isDeleted: false, deletedFor: [], reactions: {} };
                    if(dbFirestore) await setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'messages', aiMsgId), aiMsg);
                    else window.db.messages.push(aiMsg);
                    window.playSynthSound('received');
                    window.aiGeneratingText = false; window.render(); window.scrollToBottom();
                }
            }
        }

        window.createNewGroupSubmit = async function() {
            const name = document.getElementById('newGroupNameInput').value.trim();
            const desc = document.getElementById('newGroupDescInput').value.trim();
            const pass = document.getElementById('newGroupPassInput').value.trim();
            if(!name) return window.showToast('Grup adı zorunludur.', 'error');
            if(pass && pass.length < 6) return window.showToast('Grup şifresi en az 6 hane olmalıdır.', 'error');

            const newGroupId = 'grp_' + Date.now();
            const groupData = {
                id: newGroupId, name: name, type: 'public', photoURL: window.newGroupPhotoUrl || 'logo.jpg', about: desc || 'Yeni Grup.', password: pass || '',
                participants: [window.user.uid], admins: [window.user.uid], creator: window.user.uid
            };

            if(dbFirestore) await setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'rooms', newGroupId), groupData);
            else window.db.rooms.push(groupData);
            
            window.showToast('Grup başarıyla oluşturuldu.');
            window.showNewGroupModal = false; window.newGroupPhotoUrl = null;
            window.switchTab('chats'); window.selectRoom(newGroupId);
        }

        window.submitStatus = async function() {
            const text = document.getElementById('statusTextInput').value.trim();
            const linkUrl = document.getElementById('statusMediaLinkInput').value.trim();
            
            let finalMediaUrl = ''; let finalMediaType = 'none';

            if (window.tempStatusFileUrl) { finalMediaUrl = window.tempStatusFileUrl; finalMediaType = window.tempStatusFileType; } 
            else if (linkUrl) {
                finalMediaUrl = linkUrl;
                if(linkUrl.match(/\.(jpeg|jpg|gif|png|webp)/i)) finalMediaType = 'image';
                else if(linkUrl.match(/\.(mp4|webm|ogg)/i)) finalMediaType = 'video';
                else if(linkUrl.match(/\.(mp3|wav)/i)) finalMediaType = 'audio';
                else finalMediaType = 'link'; 
            }
            
            if(!text && !finalMediaUrl) return window.showToast('Metin veya medya eklemelisiniz.', 'error');

            const statusId = 'st_' + Date.now();
            const statusData = { 
                id: statusId, userId: window.user.uid, userName: window.user.displayName, userAvatar: window.user.photoURL, 
                content: text, mediaType: finalMediaType, mediaUrl: finalMediaUrl, timestamp: new Date().toISOString(), viewers: [], likes: [] 
            };

            if(dbFirestore) await setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'statusUpdates', statusId), statusData);
            else window.db.statusUpdates.push(statusData);
            
            window.showToast('Durumunuz paylaşıldı!');
            window.showStatusModal = false; window.tempStatusFileUrl = null; window.render();
        }

        // Durum (Hikaye) Görüntüleme
        window.viewStatus = async function(targetUserId) {
            const updates = window.db.statusUpdates.filter(s => s.userId === targetUserId);
            if(updates.length === 0) return;
            if(targetUserId !== window.user.uid) {
                updates.forEach(async upd => {
                    if(!upd.viewers.includes(window.user.uid)) {
                        upd.viewers.push(window.user.uid);
                        if(dbFirestore) await updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'statusUpdates', upd.id), { viewers: upd.viewers });
                    }
                });
            }
            window.statusViewModal = { show: true, data: updates }; window.render();
        }

        window.initApp = async function() {
            let isRendered = false;
            const safeBoot = () => { if(!isRendered) { window.render(); isRendered = true; } };
            setTimeout(safeBoot, 1500); // Daha hızlı boot

            if(auth) {
                try {
                    await signInAnonymously(auth);
                    
                    const collections = ['users', 'rooms', 'messages', 'statusUpdates', 'feedbacks'];
                    collections.forEach(colName => {
                        onSnapshot(collection(dbFirestore, 'artifacts', appId, 'public', 'data', colName), (snapshot) => {
                            let cloudData = snapshot.docs.map(doc => doc.data());
                            
                            // Akıllı Eşleştirme (Cloud vs Local)
                            if(colName === 'users') {
                                if(window.currentUserUid) {
                                    let cUser = cloudData.find(u=>u.uid === window.currentUserUid);
                                    let lUser = window.db.users.find(u=>u.uid === window.currentUserUid);
                                    if(lUser && !cUser) {
                                        // Bulut eksik, yerel geçerli (üzerine yaz)
                                        setDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'users', lUser.uid), lUser).catch(e=>{});
                                    } else if(cUser) {
                                        window.user = cUser; // Bulut güncel
                                    }
                                }
                                // Yerel belleği her zaman koru
                                cloudData.forEach(cu => {
                                    if(!window.db.users.find(lu=>lu.uid === cu.uid)) window.db.users.push(cu);
                                });
                                localStorage.setItem('sohbetod_local_users', JSON.stringify(window.db.users));
                            } else {
                                window.db[colName] = cloudData;
                            }

                            if(colName === 'rooms') {
                                if(!window.db.rooms.find(r=>r.id === 'sys_ai')) window.db.rooms.push({ id: 'sys_ai', name: 'Sohbetod AI Asistanı', type: 'ai', photoURL: 'logo.jpg', about: 'Sohbetod Resmi Yapay Zekası', participants: ['system'], creator: 'system', admins:[] });
                                if(!window.db.rooms.find(r=>r.id === 'sys_feedback')) window.db.rooms.push({ id: 'sys_feedback', name: 'Şikayet ve Öneriler', type: 'system', photoURL: 'logo.jpg', about: 'Yönetime Ulaşın', participants: ['system'], creator: 'system', admins:[] });
                            }
                            if (isRendered) window.render(); 
                        }, (error) => { console.warn(`Sync hatası ${colName}`); });
                    });
                    safeBoot(); 
                } catch (e) { safeBoot(); }
            } else { safeBoot(); }
        }
        setTimeout(() => { window.initApp(); }, 100);

        window.render = function() {
            // Tema Sınıflarını Uygula

            const panelC = isDark ? 'bg-[#0a0d14]' : 'bg-white';

            const borderC = isDark ? 'border-slate-800' : 'border-gray-200';
            const inputC = isDark ? 'bg-[#111622] text-white border-slate-700' : 'bg-white text-gray-900 border-gray-300';

            if (window.authStep === 'landing' || window.authStep === 'register' || window.authStep === 'login') {

                            ${window.authStep === 'landing' ? `

                        <button onclick="changeSearchType('user')" class="flex-1 py-2 text-xs font-bold rounded-lg ${window.searchType === 'user' ? 'bg-cyan-500 text-white' : (isDark?'text-gray-500':'text-gray-600')}">Kişiler</button>
                        <button onclick="changeSearchType('group')" class="flex-1 py-2 text-xs font-bold rounded-lg ${window.searchType === 'group' ? 'bg-cyan-500 text-white' : (isDark?'text-gray-500':'text-gray-600')}">Gruplar</button>
                    </div>
                    <input type="text" id="searchInput" value="${window.chatSearchQuery}" onkeyup="window.chatSearchQuery=this.value; window.render();" placeholder="Arama yapın..." class="w-full ${inputC} text-sm px-4 py-2.5 rounded-xl border outline-none focus:border-cyan-500">
                    <div class="pt-2 space-y-2">
                        ${window.chatSearchQuery.trim() !== '' ? window.db[window.searchType === 'user' ? 'users' : 'rooms'].filter(x => (window.searchType === 'user' ? x.email : x.name).toLowerCase().includes(window.chatSearchQuery.toLowerCase()) && x.uid !== window.user.uid && x.type !== 'private').map(res => `

            `;

            let activeMessages = window.activeRoom ? (window.activeRoom.id === 'sys_feedback' ? window.db.feedbacks.filter(m => m.senderId === window.user.uid) : window.db.messages.filter(m => m.roomId === window.activeRoom.id && !m.deletedFor?.includes(window.user.uid))) : [];
            let messagesHTML = activeMessages.map(msg => {
                let isMe = msg.senderId === window.user.uid;
                let align = isMe ? 'ml-auto rounded-tr-sm ' + (isDark?'bg-gradient-to-br from-[#1b2b38] to-[#121c25] border-cyan-900/30':'bg-cyan-100 border-cyan-200') : 'mr-auto rounded-tl-sm ' + (isDark?'bg-gradient-to-br from-[#121821] to-[#0c1016] border-slate-800/60':'bg-white border-gray-200');
                
                let mediaHTML = '';
                if(msg.mediaUrl) {

                let contentHTML = msg.isDeleted ? `<div class="text-[13px] text-gray-500 italic"><i data-lucide="ban" class="w-3 h-3 inline"></i> Silindi.</div>` : (window.activeRoom.id === 'sys_feedback' ? `${textContentHTML}<div class="mt-2 text-[10px] py-1 px-2 rounded-lg bg-amber-500/20 text-amber-500 font-bold w-fit">Durum: ${msg.status}</div>` : (mediaHTML + textContentHTML));

                        <div class="p-4 flex justify-between items-center ${glassC} border-b ${borderC} z-10">

                                <button onclick="window.showSettingsModal=true; window.render()" class="p-1.5 text-gray-500 hover:text-cyan-500"><i data-lucide="settings" class="w-5 h-5"></i></button>

                            <div class="px-5 py-3 flex justify-between items-center ${glassC} border-b ${borderC} z-20 cursor-pointer" onclick="if(window.activeRoom.type!=='system'&&window.activeRoom.type!=='ai'){window.groupInfoModal={show:true, room:window.activeRoom}; window.render();}">
                                <div class="flex items-center gap-3.5 flex-1 min-w-0">
                                    <button onclick="event.stopPropagation(); closeRoom()" class="md:hidden text-gray-500"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
                                    <div class="w-10 h-10 rounded-full overflow-hidden shrink-0">${window.generateAvatar(window.activeRoom.name, window.activeRoom.photoURL)}</div>
                                    <div class="min-w-0">
                                        <h4 class="font-bold text-sm truncate ${isDark?'text-white':'text-gray-900'}">${window.activeRoom.name}</h4>
                                        <p class="text-[10px] text-gray-500 truncate">${window.activeRoom.type === 'ai' ? 'Yapay Zeka (Hızlı Yanıt & Resim Çizer)' : (window.activeRoom.type === 'system' ? 'Sistem' : 'Üyeler')}</p>
                                    </div>
                                </div>
                            </div>
                            <div class="flex-1 overflow-y-auto px-4 md:px-8 py-6 custom-scrollbar">
                                ${messagesHTML}${aiTypingHTML}
                                <div id="messagesEnd" class="h-4"></div>
                            </div>
                            <div class="p-3 md:p-4 ${glassC} border-t ${borderC} z-20">
                                <form onsubmit="handleChatSubmitWrapper(event)" class="flex items-end gap-2 max-w-5xl mx-auto">
                                    ${window.activeRoom.id !== 'sys_feedback' ? `<button type="button" onclick="document.getElementById('chatFileInput').click()" class="p-3.5 text-gray-500 hover:text-cyan-500 ${inputC} rounded-xl border shrink-0"><i data-lucide="paperclip" class="w-5 h-5"></i></button>` : ''}
                                    <div class="flex-1 ${inputC} rounded-2xl flex items-center border overflow-hidden focus-within:border-cyan-500">
                                        <input type="text" id="msgTextInput" autocomplete="off" placeholder="${window.activeRoom.id === 'sys_ai' ? 'Bana manzara resmi çiz...' : 'Mesaj yazın...'}" class="w-full bg-transparent text-sm px-4 py-3.5 outline-none">
                                        <button type="submit" class="m-1.5 p-2 bg-cyan-600 text-white rounded-xl"><i data-lucide="send" class="w-5 h-5 ml-0.5"></i></button>
                                    </div>
                                    ${window.activeRoom.id !== 'sys_feedback' ? `<button type="button" onclick="toggleVoiceRecord()" class="p-3.5 rounded-xl border shrink-0 ${window.isRecording ? 'text-rose-500 bg-rose-500/10 border-rose-500 animate-pulse' : 'text-gray-500 ' + inputC}"><i data-lucide="${window.isRecording ? 'square' : 'mic'}" class="w-5 h-5"></i></button>` : ''}
                                </form>
                            </div>
                        ` : `<div class="flex-1 flex flex-col items-center justify-center p-8 text-center"><h3 class="font-bold text-2xl ${isDark?'text-white':'text-gray-900'} opacity-50">Sohbetod Web Pro</h3></div>`}
                    </div>
                </div>

                <!-- MODALS -->
                ${window.showSettingsModal ? `
                    <div class="fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4">
                        <div class="w-full max-w-sm ${panelC} p-6 rounded-3xl border ${borderC} animate-pop">
                            <div class="flex justify-between items-center mb-6"><h3 class="font-bold text-lg ${isDark?'text-white':'text-gray-900'}">Ayarlar</h3><button onclick="window.showSettingsModal=false; window.render()" class="text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button></div>
                            <div class="space-y-4">
                                <div><label class="block text-xs font-bold text-cyan-500 mb-2">Tema Modu</label>
                                    <select onchange="applySettings('theme', this.value)" class="w-full p-3 ${inputC} rounded-xl text-sm outline-none">
                                        <option value="dark" ${isDark?'selected':''}>Karanlık Mod</option><option value="light" ${!isDark?'selected':''}>Gündüz Modu</option>
                                    </select>
                                </div>
                                <div><label class="block text-xs font-bold text-cyan-500 mb-2">Sohbet Arkaplanı</label>
                                    <div class="flex gap-2">
                                        <button onclick="applySettings('bg', 'default')" class="flex-1 p-2 ${inputC} border rounded-lg text-xs">Varsayılan</button>
                                        <button onclick="document.getElementById('bgFileInput').click()" class="flex-1 p-2 bg-cyan-600 text-white rounded-lg text-xs">Resim Seç</button>
                                    </div>
                                    <div class="mt-2 flex items-center gap-2"><input type="color" id="bgColorPicker" value="#111522" class="w-8 h-8 rounded border-none cursor-pointer"><button onclick="applySettings('bg', 'color')" class="text-xs ${isDark?'text-gray-300':'text-gray-700'} underline">Rengi Uygula</button></div>
                                </div>
                            </div>
                        </div>
                    </div>` : ''}

                ${window.showProfileModal ? `
                    <div class="fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4">
                        <div class="w-full max-w-sm ${panelC} p-6 rounded-3xl border ${borderC} animate-pop">
                            <div class="flex justify-between items-center mb-6"><h3 class="font-bold text-lg ${isDark?'text-white':'text-gray-900'}">Profil</h3><button onclick="window.showProfileModal=false; window.render()" class="text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button></div>
                            <div class="flex flex-col items-center mb-4">
                                <div id="profPhotoPreview" class="w-20 h-20 rounded-full overflow-hidden border-2 border-cyan-500 mb-3">${window.generateAvatar(window.user.displayName, window.tempProfileFileUrl || window.user.photoURL)}</div>
                                <input type="file" id="hiddenProfileFileInput" class="hidden" accept="image/*" onchange="(async (e)=>{ if(!e.target.files[0])return; if(e.target.files[0].size > 500*1024*1024)return; window.tempProfileFileUrl = await window.fileToBase64(e.target.files[0]); window.render(); })(event)">
                                <button onclick="document.getElementById('hiddenProfileFileInput').click()" class="text-xs text-cyan-500 border border-cyan-500 px-3 py-1 rounded-lg">Resim Değiştir</button>
                            </div>
                            <input type="text" id="profName" value="${window.user.displayName}" class="w-full px-4 py-3 ${inputC} rounded-xl text-sm mb-3">
                            <input type="text" id="profAbout" value="${window.user.about||''}" placeholder="Hakkımda" class="w-full px-4 py-3 ${inputC} rounded-xl text-sm mb-4">
                            <button onclick="updateProfile()" class="w-full py-3 bg-cyan-600 text-white font-bold rounded-xl text-sm">Kaydet</button>
                        </div>
                    </div>` : ''}

                ${window.showNewGroupModal ? `
                    <div class="fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4">
                        <div class="w-full max-w-md ${panelC} p-6 rounded-3xl border ${borderC} animate-pop">
                            <div class="flex justify-between items-center mb-6"><h3 class="font-bold text-lg ${isDark?'text-white':'text-gray-900'}">Yeni Grup</h3><button onclick="window.showNewGroupModal=false; window.render()" class="text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button></div>
                            <div class="space-y-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-14 h-14 rounded-full border border-cyan-500 overflow-hidden shrink-0 flex items-center justify-center bg-gray-800 text-xs text-center cursor-pointer" onclick="document.getElementById('newGrpPhoto').click()">${window.newGroupPhotoUrl ? `<img src="${window.newGroupPhotoUrl}" class="w-full h-full object-cover">` : 'Resim<br>Ekle'}</div>
                                    <input type="file" id="newGrpPhoto" class="hidden" accept="image/*" onchange="(async(e)=>{if(e.target.files[0]){ window.newGroupPhotoUrl = await window.fileToBase64(e.target.files[0]); window.render();}})(event)">
                                    <input type="text" id="newGroupNameInput" placeholder="Grup Adı" class="flex-1 px-4 py-3 ${inputC} rounded-xl text-sm outline-none">
                                </div>
                                <input type="text" id="newGroupDescInput" placeholder="Hakkında" class="w-full px-4 py-3 ${inputC} rounded-xl text-sm outline-none">
                                <div class="relative">
                                    <input type="password" id="newGroupPassInput" placeholder="Katılım Şifresi (Min 6 Hane)" class="w-full px-4 py-3 pr-10 ${inputC} rounded-xl text-sm outline-none">
                                    <button type="button" onclick="togglePasswordVisibility('newGroupPassInput')" class="absolute right-3 top-3.5 text-gray-500"><i id="newGroupPassInput-icon" data-lucide="eye" class="w-5 h-5"></i></button>
                                </div>
                                <button onclick="createNewGroupSubmit()" class="w-full py-3.5 bg-cyan-600 text-white font-bold rounded-xl text-sm">Oluştur</button>
                            </div>
                        </div>
                    </div>` : ''}

                ${window.groupInspectModal.show && window.groupInspectModal.room ? `
                    <div class="fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4">
                        <div class="w-full max-w-sm ${panelC} p-6 rounded-3xl border ${borderC} text-center animate-pop">
                            <div class="w-20 h-20 mx-auto rounded-full border border-cyan-500 overflow-hidden mb-3">${window.generateAvatar(window.groupInspectModal.room.name, window.groupInspectModal.room.photoURL)}</div>
                            <h3 class="font-bold text-lg ${isDark?'text-white':'text-gray-900'}">${window.groupInspectModal.room.name}</h3>
                            <p class="text-xs text-gray-500 mb-4">${window.groupInspectModal.room.about}</p>
                            ${window.groupInspectModal.room.password ? `
                                <div class="relative mb-4">
                                    <input type="password" id="inspectGroupPass" placeholder="Şifre Girin" class="w-full px-4 py-3 ${inputC} rounded-xl text-sm text-center outline-none">
                                    <button type="button" onclick="togglePasswordVisibility('inspectGroupPass')" class="absolute right-3 top-3.5 text-gray-500"><i id="inspectGroupPass-icon" data-lucide="eye" class="w-5 h-5"></i></button>
                                </div>
                            ` : ''}
                            <div class="flex gap-2"><button onclick="window.groupInspectModal={show:false}; window.render();" class="flex-1 py-3 bg-gray-600 text-white rounded-xl text-sm font-bold">İptal</button><button onclick="(async()=>{ let r=window.groupInspectModal.room; if(r.password && document.getElementById('inspectGroupPass').value!==r.password) return window.showToast('Hatalı Şifre', 'error'); r.participants.push(window.user.uid); if(dbFirestore) await updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'rooms', r.id), { participants: r.participants }); window.groupInspectModal={show:false}; window.switchTab('chats'); window.selectRoom(r.id); })()" class="flex-1 py-3 bg-cyan-600 text-white rounded-xl text-sm font-bold">Katıl</button></div>
                        </div>
                    </div>` : ''}

                ${window.showStatusModal ? `
                    <div class="fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4">
                        <div class="w-full max-w-md ${panelC} p-6 rounded-3xl border ${borderC} animate-pop">
                            <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg ${isDark?'text-white':'text-gray-900'}">Durum Paylaş</h3><button onclick="window.showStatusModal=false; window.render()" class="text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button></div>
                            <div class="space-y-4">
                                <input type="file" id="stFile" class="hidden" accept="image/*,video/*,audio/*" onchange="(async(e)=>{ if(!e.target.files[0])return; if(e.target.files[0].size > 500*1024*1024)return window.showToast('Max 500MB', 'error'); window.tempStatusFileUrl=await window.fileToBase64(e.target.files[0]); window.tempStatusFileType=e.target.files[0].type.split('/')[0]; window.showToast('Medya Eklendi'); window.render(); })(event)">
                                <button onclick="document.getElementById('stFile').click()" class="w-full py-4 border-2 border-dashed border-cyan-500/50 rounded-xl text-cyan-500 font-bold flex flex-col items-center"><i data-lucide="upload" class="w-6 h-6 mb-1"></i>${window.tempStatusFileUrl ? 'Medya Değiştir' : 'Video/Müzik/Resim Ekle'}</button>
                                <textarea id="statusTextInput" placeholder="Büyük sinematik metin ekle..." class="w-full px-4 py-3 ${inputC} rounded-xl text-sm resize-none h-20 outline-none"></textarea>
                                <button onclick="submitStatus()" class="w-full py-3.5 bg-cyan-600 text-white font-bold rounded-xl text-sm">Paylaş</button>
                            </div>
                        </div>
                    </div>` : ''}

                ${window.statusViewModal.show && window.statusViewModal.data ? `
                    <div class="fixed inset-0 z-[90] bg-black flex items-center justify-center p-4">
                        <button onclick="window.statusViewModal={show:false}; window.render();" class="absolute top-4 right-4 p-2 bg-white/20 rounded-full text-white z-50"><i data-lucide="x" class="w-6 h-6"></i></button>
                        <div class="w-full max-w-md h-[80vh] bg-gray-900 rounded-2xl relative overflow-hidden flex flex-col">
                            <div class="absolute top-0 w-full p-4 bg-gradient-to-b from-black/80 to-transparent flex items-center gap-3 z-20">
                                <div class="w-10 h-10 rounded-full border border-white/50 overflow-hidden shrink-0">${window.generateAvatar(window.statusViewModal.data[0].userName, window.statusViewModal.data[0].userAvatar)}</div>
                                <div class="text-white font-bold text-sm drop-shadow-md">${window.statusViewModal.data[0].userName}</div>
                            </div>
                            <div class="flex-1 flex flex-col items-center justify-center relative bg-black w-full h-full">
                                ${window.statusViewModal.data[0].mediaType === 'image' ? `<img src="${window.statusViewModal.data[0].mediaUrl}" class="w-full h-full object-cover">` : 
                                  window.statusViewModal.data[0].mediaType === 'video' ? `<video src="${window.statusViewModal.data[0].mediaUrl}" class="w-full h-full object-cover" autoplay controls></video>` : 
                                  window.statusViewModal.data[0].mediaType === 'audio' ? `<div class="p-8 text-center w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-indigo-900 to-purple-900"><i data-lucide="music" class="w-16 h-16 text-cyan-400 mb-6 animate-pulse"></i><audio src="${window.statusViewModal.data[0].mediaUrl}" controls class="w-full"></audio></div>` : ''}
                                ${window.statusViewModal.data[0].content ? `<div class="absolute inset-0 flex items-center justify-center p-8 pointer-events-none z-30"><p class="text-white text-3xl font-extrabold text-center drop-shadow-[0_4px_4px_rgba(0,0,0,1)] uppercase bg-black/30 px-6 py-4 rounded-2xl backdrop-blur-sm" style="font-family: impact, sans-serif;">${window.formatText(window.statusViewModal.data[0].content)}</p></div>` : ''}
                            </div>
                            <div class="absolute bottom-0 w-full p-4 bg-gradient-to-t from-black/90 to-transparent z-40 flex justify-between items-end">
                                ${window.statusViewModal.data[0].userId === window.user.uid ? `<div class="text-white text-xs flex flex-col items-center"><i data-lucide="eye" class="w-5 h-5"></i>${window.statusViewModal.data[0].viewers.length} İzlenme</div>` : '<div></div>'}
                                <div class="flex flex-col items-center">
                                    <button onclick="(async()=>{ let sid = window.statusViewModal.data[0].id; let st = window.db.statusUpdates.find(s=>s.id===sid); if(!st)return; if(st.likes.includes(window.user.uid)) st.likes = st.likes.filter(x=>x!==window.user.uid); else st.likes.push(window.user.uid); if(dbFirestore) await updateDoc(doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'statusUpdates', sid), {likes: st.likes}); window.render(); })()" class="bg-black/50 p-3 rounded-full"><i data-lucide="heart" class="w-6 h-6 ${window.statusViewModal.data[0].likes.includes(window.user.uid) ? 'text-rose-500 fill-rose-500' : 'text-white'}"></i></button>
                                    <span class="text-white text-[10px] font-bold mt-1">${window.statusViewModal.data[0].likes.length} Beğeni</span>
                                </div>
                            </div>
                        </div>
                    </div>` : ''}
            `;
            if(window.lucide) window.lucide.createIcons();
        };
    </script>
</body>
</html>
